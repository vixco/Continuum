# Cargo build configuration for Continuum
#
# whisper-rs-sys requires:
# - LLVM/libclang for bindgen (set LIBCLANG_PATH)
# - cmake for building whisper.cpp
# - MSVC system headers for bindgen on Windows
#
# ort (ONNX Runtime) requires:
# - onnxruntime.dll at runtime (set ORT_DYLIB_PATH)
#
# lance-encoding (via lancedb) requires:
# - protoc (Protocol Buffers compiler) for prost-build
#   Download from: https://github.com/protocolbuffers/protobuf/releases
#   Set PROTOC env var to the path of protoc.exe

[build]
# `target-dir` is intentionally NOT set here — hardcoding an absolute path
# breaks CI and any collaborator whose workspace lives elsewhere. Set
# `CARGO_TARGET_DIR` in your shell (or `.cargo/config.local.toml`, which
# this file's `include` pulls in) if you want to redirect the build
# artifacts to a different drive for performance.

# sccache wraps rustc so repeated builds of the same crate+flags are
# cache hits (near-instant). First build is normal speed, subsequent
# clean rebuilds across branches are dramatically faster.
# Install: download the prebuilt Windows binary from
#   https://github.com/mozilla/sccache/releases → place at ~/.cargo/bin/sccache.exe
# Commented out by default because CI installs sccache via its own action
# and setting the wrapper before that action runs poisons cargo with
# "program not found" errors. Uncomment locally once sccache is on PATH.
# rustc-wrapper = "sccache"

[env]
# Native dependency locations are intentionally not committed here. Absolute
# maintainer paths make Cargo configuration non-portable and can shadow values
# installed by CI. `scripts/dev-setup.ps1` reports the exact variables needed
# by a local machine; CI sets them explicitly in its workflow.

# Ninja generator for cmake. Required for CUDA 13.1+ which needs VS 2022
# integration that VS 2019 BuildTools doesn't have. Ninja calls nvcc directly.
CMAKE_GENERATOR = "Ninja"

# Force C++ deps (whisper.cpp, llama.cpp, and every crate using the `cc`
# or `cmake` crates for native code) to build with the Release CRT even
# when Rust itself is in debug mode. Without this, file handles crossing
# the Rust ↔ native-code boundary trigger a debug-CRT assertion in
# read.cpp:381 (`_osfile(fh) & FOPEN`) and Continuum crashes with exit
# code 3 during whisper model load.
#
# Why both env vars are needed on Windows MSVC:
#
# - CMAKE_BUILD_TYPE=Release makes the `cmake` crate pass
#   -DCMAKE_BUILD_TYPE=Release to cmake, which selects /MD (release CRT)
#   instead of /MDd (debug CRT) for MSVC builds.
#
# - DEBUG=false makes the `cc` crate (used by llama-cpp-sys-2 for its
#   wrapper C++ files, among others) compile with /MD instead of /MDd.
#   The `cc` crate keys off the DEBUG env var that cargo normally sets
#   to "true" for debug profiles; overriding it here forces /MD for all
#   native C/C++ wrapper builds. Side effect: no -g/ /Zi debug symbols in
#   the C/C++ code, which is fine — we iterate on the Rust side, not on
#   llama.cpp internals. OPT_LEVEL=0 is still respected by cc for
#   generated code, so debug iteration speed isn't affected.
#
# Release cargo builds already set both to Release/false equivalents,
# so these overrides only change behaviour for `cargo build` /
# `cargo run` without --release.
CMAKE_BUILD_TYPE = "Release"
DEBUG = "false"
