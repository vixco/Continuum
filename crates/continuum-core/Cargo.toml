[package]
name = "continuum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Main orchestration runtime for Continuum — the four-layer cognitive engine"

[features]
# `runtime` is on by default so `cargo build -p continuum-core` and the continuum
# binary work unchanged. The desktop app sets `default-features = false` to
# avoid pulling llama-cpp + whisper into the Tauri build — it only needs
# the state / log / health / config modules.
default = ["runtime"]
runtime = [
    "dep:continuum-llm",
    "dep:continuum-vision",
    "dep:xcap",
    "dep:sqlx",
    "dep:lancedb",
    "dep:fastembed",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:cpal",
    "dep:whisper-rs",
    "dep:rubato",
    "dep:futures",
    "dep:notify",
]
cuda = ["runtime", "continuum-llm/cuda", "whisper-rs/cuda"]
vulkan = ["runtime", "continuum-llm/vulkan"]
# Moshi full-duplex speech-to-speech front-end (kyutai-labs/moshi). Off by
# default: it pulls in `tokio-tungstenite` + `native-tls` and requires a
# separately-built `moshi-backend.exe` (CUDA) at runtime. The base `moshi`
# feature covers the WSS transport + binary message framing + assistant-text
# channel + control messages — enough to connect to the backend and drive
# the text transcript path. The default voice path stays the
# whisper→triage→orchestrator→TTS pipeline (`voice.frontend.mode = "pipeline"`).
moshi = ["runtime", "dep:tokio-tungstenite", "dep:native-tls"]
# Opus/OGG audio codec for the Moshi WebSocket protocol (the backend speaks
# Opus-in-OGG, not raw PCM — see `voice/moshi.rs` protocol notes). Requires
# libopus at build time (vcpkg `opus`, or the `opus` crate's vendored build).
# Without this feature `MoshiFrontend` connects and handles text/control,
# but audio I/O returns a configured error. Kept separate so the base
# `moshi` feature compiles on machines without libopus.
moshi-opus = ["moshi", "dep:opus", "dep:ogg"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
image = { workspace = true }
dirs = "6"
toml = "0.8"
parking_lot = "0.12"
# Privacy filter scrubbers (senses/privacy.rs). Deliberately NOT gated behind
# `runtime` — the privacy module is the choke point for every process that
# links continuum-core (runtime, MCP server, desktop), so it must compile
# under `--no-default-features` too (spec §3, context engine).
regex = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "multithread"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Memory vault (Plan B): markdown + derived SQLite index. Deliberately NOT
# gated behind `runtime` — it is lightweight by design, and the `continuum`
# runtime binary (runtime-only) needs it unconditionally, so it must keep
# compiling under `--no-default-features` (the desktop app's build) too.
continuum-memory = { path = "../continuum-memory" }

# Optional (feature = "runtime"): heavy native deps
continuum-vision = { path = "../continuum-vision", optional = true }
continuum-llm = { path = "../continuum-llm", optional = true }
xcap = { version = "0.8", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
lancedb = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
# File watcher (senses/file_watch.rs, context engine §4.5). Same version as
# the vault watcher in continuum-memory — keep them in lockstep.
notify = { version = "6.1", optional = true }
cpal = { version = "0.17", optional = true }
whisper-rs = { version = "0.16", optional = true }
rubato = { version = "2", optional = true }
# WebSocket client for the Moshi S2S backend (feature = "moshi"). The backend
# serves `wss://` with a self-signed `localhost` cert, so we need `native-tls`
# (SChannel on Windows) and accept invalid certs at connect time.
tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = ["connect", "native-tls"] }
# `native-tls` is re-exported through tokio-tungstenite, but we need it as a
# direct dep to build the `TlsConnector` with `danger_accept_invalid_certs`.
native-tls = { version = "0.2", optional = true }
# Opus + OGG codec for Moshi audio (feature = "moshi-opus"). `ogg` is pure
# Rust; `opus` wraps libopus (native, via pkg-config/vcpkg/vendored).
ogg = { version = "0.9", optional = true }
opus = { version = "0.3", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "continuum"
path = "src/bin/continuum.rs"
required-features = ["runtime"]

[[bin]]
name = "continuum-perception"
path = "src/bin/continuum-perception.rs"
required-features = ["runtime"]

[[bin]]
name = "continuum-triage-bench"
path = "src/bin/continuum-triage-bench.rs"
required-features = ["runtime"]

[[bin]]
name = "audio-probe"
path = "src/bin/audio-probe.rs"
required-features = ["runtime"]

# Context-engine evaluation harnesses (spec §9, Task C6). The fourth one
# (continuum-redaction-bench) lives in continuum-mcp: it must call the real
# MCP tool handlers, and continuum-core cannot depend on continuum-mcp
# without a dependency cycle.
[[bin]]
name = "continuum-context-bench"
path = "src/bin/continuum-context-bench.rs"
required-features = ["runtime"]

[[bin]]
name = "continuum-dedupe-bench"
path = "src/bin/continuum-dedupe-bench.rs"
required-features = ["runtime"]

[[bin]]
name = "continuum-memory-precision-bench"
path = "src/bin/continuum-memory-precision-bench.rs"
required-features = ["runtime"]

[[test]]
name = "orchestrator_mock"
path = "tests/orchestrator_mock.rs"
required-features = ["runtime"]

[[test]]
name = "phase8_workers"
path = "tests/phase8_workers.rs"
required-features = ["runtime"]

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"
required-features = ["runtime"]

[[example]]
name = "voice_demo"
path = "examples/voice_demo.rs"
required-features = ["runtime"]

[[example]]
name = "voice_test"
path = "examples/voice_test.rs"
required-features = ["runtime"]

[[example]]
name = "voice_latency_bench"
path = "examples/voice_latency_bench.rs"
required-features = ["runtime"]

[[example]]
name = "worker_demo"
path = "examples/worker_demo.rs"
required-features = ["runtime"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
