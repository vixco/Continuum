[package]
name = "continuum-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Gateway — provider adapters for chat (OpenAI-compatible, Anthropic, Claude CLI)"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio-util = "0.7"
url = "2"
# Used at runtime by ClaudeCliAdapter (system-prompt file) and by tests
# (stub binaries), so it lives in the regular deps rather than dev-deps.
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
