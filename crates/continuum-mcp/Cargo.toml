[package]
name = "continuum-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing Windows-specific tools to Claude Code for Continuum"

[[bin]]
name = "continuum-mcp"
path = "src/main.rs"

# The safety-redaction harness (context engine spec §9, Task C6). It lives
# here rather than beside its three siblings in continuum-core because it
# must call the real MCP tool handlers, and continuum-core cannot depend on
# continuum-mcp without a dependency cycle.
[[bin]]
name = "continuum-redaction-bench"
path = "src/bin/continuum-redaction-bench.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rmcp = { version = "1.4", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
url = "2"
dirs = "6"
glob = "0.3"
base64 = "0.22"
toml = "0.8"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
continuum-core = { path = "../continuum-core" }
continuum-memory = { path = "../continuum-memory" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
