[package]
name = "kairo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing Windows-specific tools to Claude Code for Kairo"

[[bin]]
name = "kairo-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rmcp = { version = "1.4", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
url = "2"
dirs = "6"
glob = "0.3"
toml = "0.8"
kairo-core = { path = "../kairo-core" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
