chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
ulid = "1"
regex = "1"
notify = "6.1"
notify-debouncer-mini = "0.4"

[dev-dependencies]
tempfile = "3"
