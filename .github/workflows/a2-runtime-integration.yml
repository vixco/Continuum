name: A2 runtime integration patch

on:
  push:
    branches: [swarm/a2-ambient-perception]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[a2-runtime-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow runtime integration
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # continuum-vision: force privacy admission before hashing/gating and expose
          # compact evidence/status lines for the existing context channel.
          path = "crates/continuum-vision/src/perception.rs"
          replace_one(path, "    pub fn from_rgba(image: &RgbaImage) -> Self {", "    fn from_rgba(image: &RgbaImage) -> Self {")
          replace_one(path, '''        structural.max(luminance)\n    }\n}\n\n/// Unique identity for a whole display or bounded dirty region.''', '''        structural.max(luminance)\n    }\n\n    /// Strong digest for cache/provenance identity.\n    pub fn content_digest(&self) -> &[u8; 32] {\n        &self.content_digest\n    }\n\n    /// Original frame width.\n    pub fn width(&self) -> u32 {\n        self.width\n    }\n\n    /// Original frame height.\n    pub fn height(&self) -> u32 {\n        self.height\n    }\n\n    /// Pixel format bound into the strong digest.\n    pub fn pixel_format(&self) -> PixelFormat {\n        self.pixel_format\n    }\n}\n\n/// Privacy-admitted result of fingerprinting and change gating one frame.\n#[derive(Debug, Clone, Copy, PartialEq, Serialize, Deserialize)]\npub struct FrameEvaluation {\n    fingerprint: FrameFingerprint,\n    decision: GateDecision,\n}\n\nimpl FrameEvaluation {\n    /// Fingerprint produced only after privacy admission.\n    pub fn fingerprint(&self) -> FrameFingerprint {\n        self.fingerprint\n    }\n\n    /// Change-gate decision for this occurrence.\n    pub fn decision(&self) -> GateDecision {\n        self.decision\n    }\n}\n\n/// Public privacy choke point for frame-derived metadata.\n///\n/// `never_observe` returns `None` before hashing, gating, cache-key creation,\n/// or semantic-selection hooks can run. Consumers should not call lower-level\n/// frame primitives directly; their constructors are crate-private.\n#[derive(Debug)]\npub struct PrivacyGatedFrameGate {\n    gate: ChangeGate,\n}\n\nimpl PrivacyGatedFrameGate {\n    /// Build a bounded gate with the default cardinality cap.\n    pub fn new(threshold: f32, fallback_after: Duration) -> Self {\n        Self {\n            gate: ChangeGate::new(threshold, fallback_after),\n        }\n    }\n\n    /// Build a bounded gate with an explicit cardinality cap.\n    pub fn with_max_keys(threshold: f32, fallback_after: Duration, max_keys: usize) -> Self {\n        Self {\n            gate: ChangeGate::with_max_keys(threshold, fallback_after, max_keys),\n        }\n    }\n\n    /// Privacy-admit, fingerprint, and change-gate one RGBA frame.\n    pub fn evaluate_rgba_at(\n        &mut self,\n        sensitivity: Sensitivity,\n        key: ObservationKey,\n        image: &RgbaImage,\n        now: Instant,\n    ) -> Option<FrameEvaluation> {\n        self.evaluate_with_hooks(\n            sensitivity,\n            key,\n            now,\n            || FrameFingerprint::from_rgba(image),\n            |_| {},\n        )\n    }\n\n    /// Number of display/region states currently retained.\n    pub fn tracked_keys(&self) -> usize {\n        self.gate.tracked_keys()\n    }\n\n    /// Total cardinality evictions since this gate was created.\n    pub fn evicted_keys(&self) -> u64 {\n        self.gate.evicted_keys()\n    }\n\n    /// Invalidate one display after disconnect/reconfiguration.\n    pub fn invalidate_display(&mut self, display_id: &str) {\n        self.gate.invalidate_display(display_id);\n    }\n\n    fn evaluate_with_hooks<Hash, Semantic>(\n        &mut self,\n        sensitivity: Sensitivity,\n        key: ObservationKey,\n        now: Instant,\n        hash: Hash,\n        semantic_selected: Semantic,\n    ) -> Option<FrameEvaluation>\n    where\n        Hash: FnOnce() -> FrameFingerprint,\n        Semantic: FnOnce(&FrameEvaluation),\n    {\n        if sensitivity == Sensitivity::NeverObserve {\n            return None;\n        }\n        let fingerprint = hash();\n        let decision = self.gate.evaluate_at(key, fingerprint, now);\n        let evaluation = FrameEvaluation {\n            fingerprint,\n            decision,\n        };\n        if decision.should_encode {\n            semantic_selected(&evaluation);\n        }\n        Some(evaluation)\n    }\n}\n\n/// Unique identity for a whole display or bounded dirty region.''')
          replace_one(path, '''    /// Whether provenance fields are complete enough for temporal evidence citation.\n    pub fn provenance_complete(&self) -> bool {\n        !self.observation_id.trim().is_empty()\n            && !self.source.trim().is_empty()\n            && self.timestamp_unix_ms > 0\n    }\n}\n''', '''    /// Whether provenance fields are complete enough for temporal evidence citation.\n    pub fn provenance_complete(&self) -> bool {\n        !self.observation_id.trim().is_empty()\n            && !self.source.trim().is_empty()\n            && self.timestamp_unix_ms > 0\n    }\n\n    /// Compact metadata-only evidence line for the existing world/context channel.\n    /// No semantic text or screenshot path is included.\n    pub fn compact_evidence_line(&self) -> String {\n        let digest = self\n            .content_digest\n            .iter()\n            .map(|byte| format!("{byte:02x}"))\n            .collect::<String>();\n        format!(\n            "[screen_observation] id={} display={} digest={} change={:.3} semantic={} confidence={:.3} sensitivity={:?}",\n            self.observation_id,\n            self.key.display_id,\n            digest,\n            self.change_score,\n            self.semantic_processed,\n            self.confidence,\n            self.sensitivity\n        )\n    }\n}\n''')
          replace_one(path, "    pub last_searchable_latency_us: u64,", "    pub last_observation_emit_latency_us: u64,")
          replace_one(path, '        let mut first = synthetic_observation("obs-1");', '        let first = synthetic_observation("obs-1");')
          replace_one(path, '''    #[test]\n    fn unchanged_frames_are_deduplicated_before_fallback() {''', '''    #[test]\n    fn never_observe_admission_runs_neither_hash_nor_semantic_hook() {\n        use std::cell::Cell;\n\n        let hash_calls = Cell::new(0u32);\n        let semantic_calls = Cell::new(0u32);\n        let mut gate = PrivacyGatedFrameGate::new(0.05, Duration::from_secs(5));\n        let image = solid(32, 18, 10);\n        let result = gate.evaluate_with_hooks(\n            Sensitivity::NeverObserve,\n            ObservationKey::display("display-private"),\n            Instant::now(),\n            || {\n                hash_calls.set(hash_calls.get() + 1);\n                FrameFingerprint::from_rgba(&image)\n            },\n            |_| semantic_calls.set(semantic_calls.get() + 1),\n        );\n        assert!(result.is_none());\n        assert_eq!(hash_calls.get(), 0);\n        assert_eq!(semantic_calls.get(), 0);\n        assert_eq!(gate.tracked_keys(), 0);\n    }\n\n    #[test]\n    fn unchanged_frames_are_deduplicated_before_fallback() {''')

          # Benchmark must go through the public privacy gate, never the private hasher.
          path = "crates/continuum-vision/examples/perception_gate_bench.rs"
          replace_one(path, '''use continuum_vision::perception::{ChangeGate, FrameFingerprint, ObservationKey};''', '''use continuum_vision::perception::{ObservationKey, PrivacyGatedFrameGate, Sensitivity};''')
          replace_one(path, '''    let mut gate = ChangeGate::new(0.05, Duration::from_secs(30));''', '''    let mut gate = PrivacyGatedFrameGate::new(0.05, Duration::from_secs(30));''')
          replace_one(path, '''        let fingerprint = FrameFingerprint::from_rgba(&image);\n        let decision = gate.evaluate_at(\n            key.clone(),\n            fingerprint,\n            clock + Duration::from_millis(iteration * 20),\n        );\n        semantic_requests += u64::from(decision.should_encode);''', '''        let evaluation = gate\n            .evaluate_rgba_at(\n                Sensitivity::CloudAllowed,\n                key.clone(),\n                &image,\n                clock + Duration::from_millis(iteration * 20),\n            )\n            .expect("synthetic cloud-allowed frame should be admitted");\n        semantic_requests += u64::from(evaluation.decision().should_encode);''')

          # Runtime bridge: existing watcher remains authoritative for xcap + cheap luma.
          # A2 adds a second-stage privacy-gated strong fingerprint only for selected packets.
          path = "crates/continuum-core/src/senses/vision.rs"
          replace_one(path, '''use xcap::Monitor;\n\nuse crate::config::{ContextConfig, ObservationToggles, PrivacyConfig, ScreenConfig};''', '''use xcap::Monitor;\n\nuse continuum_vision::perception::{\n    AmbientObservation, GateReason, ObservationKey, PerceptionHealth, PerceptionMetrics,\n    PrivacyGatedFrameGate, RetentionClass, Sensitivity as PerceptionSensitivity,\n    OBSERVATION_SCHEMA_VERSION,\n};\n\nuse crate::config::{ContextConfig, ObservationToggles, PrivacyConfig, ScreenConfig};''')
          replace_one(path, '''        let mut cache: HashMap<String, VisionCache> = HashMap::new();\n\n        loop {''', '''        let mut cache: HashMap<String, VisionCache> = HashMap::new();\n        let mut perception_gate = PrivacyGatedFrameGate::new(\n            self.config.meaningful_change_threshold,\n            Duration::from_millis(self.config.vision_min_interval_ms.max(100)),\n        );\n        let mut perception_metrics = PerceptionMetrics::default();\n\n        loop {''')
          replace_one(path, '''                    self.process_capture(packet, &tx, &mut cache).await;''', '''                    self.process_capture(\n                        packet,\n                        &tx,\n                        &mut cache,\n                        &mut perception_gate,\n                        &mut perception_metrics,\n                    )\n                    .await;''')
          replace_one(path, '''        tx: &mpsc::Sender<ScreenObservation>,\n        cache: &mut HashMap<String, VisionCache>,\n    ) {''', '''        tx: &mpsc::Sender<ScreenObservation>,\n        cache: &mut HashMap<String, VisionCache>,\n        perception_gate: &mut PrivacyGatedFrameGate,\n        perception_metrics: &mut PerceptionMetrics,\n    ) {''')
          replace_one(path, '''        let current_privacy = self.live_context.monitor_privacy(&packet.target.id);\n        let privacy = strictest_disposition(packet.privacy, current_privacy);\n        let monitor_cache = cache.entry(packet.target.id.clone()).or_default();''', '''        let current_privacy = self.live_context.monitor_privacy(&packet.target.id);\n        let privacy = strictest_disposition(packet.privacy, current_privacy);\n        perception_metrics.frames_captured = perception_metrics.frames_captured.saturating_add(1);\n        perception_metrics.buffered_frames_dropped = perception_metrics\n            .buffered_frames_dropped\n            .saturating_add(buffered.dropped_before);\n        perception_metrics.last_capture_latency_us = packet.capture_latency_ms.saturating_mul(1_000);\n\n        // The xcap worker already applied the cheapest 64x36 luma gate. Only\n        // packets that survived that stage can carry a bitmap here. Resolve\n        // privacy *before* any stronger fingerprint: `never_observe` returns\n        // None without hashing or touching the semantic gate.\n        let perception_sensitivity = perception_sensitivity(privacy);\n        let change_started = Instant::now();\n        let frame_evaluation = packet.image.as_ref().and_then(|image| {\n            perception_gate.evaluate_rgba_at(\n                perception_sensitivity,\n                ObservationKey::display(packet.target.id.clone()),\n                image,\n                Instant::now(),\n            )\n        });\n        perception_metrics.last_change_detection_latency_us =\n            duration_micros_u64(change_started.elapsed());\n        if let Some(evaluation) = frame_evaluation.as_ref() {\n            match evaluation.decision().reason {\n                GateReason::ExactDuplicate => {\n                    perception_metrics.exact_duplicates_discarded = perception_metrics\n                        .exact_duplicates_discarded\n                        .saturating_add(1);\n                }\n                GateReason::BelowThreshold => {\n                    perception_metrics.low_change_discarded = perception_metrics\n                        .low_change_discarded\n                        .saturating_add(1);\n                }\n                GateReason::FirstObservation\n                | GateReason::MeaningfulChange\n                | GateReason::FallbackSample => {}\n            }\n        }\n        perception_metrics.gate_state_evictions = perception_gate.evicted_keys();\n        let monitor_cache = cache.entry(packet.target.id.clone()).or_default();''')
          replace_one(path, '''        let should_describe = privacy == PrivacyDisposition::Visible\n            && packet.meaningful_change\n            && packet.image.is_some()\n            && inference_due;\n        let mut screenshot_path = None;\n        let mut vision_updated = false;''', '''        let should_describe = privacy == PrivacyDisposition::Visible\n            && packet.meaningful_change\n            && packet.image.is_some()\n            && frame_evaluation\n                .as_ref()\n                .is_some_and(|evaluation| evaluation.decision().should_encode)\n            && inference_due;\n        let mut screenshot_path = None;\n        let mut vision_updated = false;\n        let mut perception_health = PerceptionHealth::Observing;''')
          replace_one(path, '''            monitor_cache.last_inference = Some(Instant::now());\n            match self.vision_model.describe(&image).await {''', '''            monitor_cache.last_inference = Some(Instant::now());\n            perception_metrics.semantic_inferences =\n                perception_metrics.semantic_inferences.saturating_add(1);\n            let inference_started = Instant::now();\n            match self.vision_model.describe(&image).await {''')
          replace_one(path, '''                Err(error) => tracing::warn!(\n                    layer = "senses",\n                    component = "vision",\n                    monitor_id = %packet.target.id,\n                    error = %error,\n                    "Local vision inference failed; capture continues"\n                ),\n            }\n        }''', '''                Err(error) => {\n                    perception_health = PerceptionHealth::EncoderUnavailable {\n                        reason: "local vision inference failed; capture continues".into(),\n                    };\n                    tracing::warn!(\n                        layer = "senses",\n                        component = "vision",\n                        monitor_id = %packet.target.id,\n                        error = %error,\n                        "Local vision inference failed; capture continues"\n                    );\n                }\n            }\n            perception_metrics.last_inference_latency_us =\n                duration_micros_u64(inference_started.elapsed());\n        }''')
          replace_one(path, '''        let snapshot = self.live_context.snapshot();\n        let observation = ScreenObservation {\n            // Caption only (spec §4.10). The compact world-state blob used\n            // to live here, which put ~1.4 kB of monitor/window/project\n            // text into every triage prompt; it now rides `world_compact`\n            // and is consumed by the context packager instead.\n            description: caption,\n            world_compact: Some(snapshot.compact_for_agents(1_400)),''', '''        let ambient_observation = if publication_privacy == PrivacyDisposition::Excluded {\n            None\n        } else {\n            frame_evaluation.as_ref().map(|evaluation| {\n                let fingerprint = evaluation.fingerprint();\n                AmbientObservation {\n                    schema_version: OBSERVATION_SCHEMA_VERSION,\n                    observation_id: format!(\n                        "screen:{}:{}:{}",\n                        packet.target.id,\n                        packet.captured_at.timestamp_millis(),\n                        packet.capture_sequence\n                    ),\n                    timestamp_unix_ms: packet.captured_at.timestamp_millis(),\n                    key: ObservationKey::display(packet.target.id.clone()),\n                    content_digest: *fingerprint.content_digest(),\n                    frame_width: fingerprint.width(),\n                    frame_height: fingerprint.height(),\n                    pixel_format: fingerprint.pixel_format(),\n                    change_score: evaluation.decision().change_score,\n                    semantic_summary: vision_updated.then(|| caption.clone()),\n                    embedding_ref: None,\n                    confidence: if vision_updated {\n                        monitor_cache.confidence\n                    } else {\n                        0.0\n                    },\n                    source: "screen:xcap".into(),\n                    sensitivity: perception_sensitivity(publication_privacy),\n                    retention: RetentionClass::RecentHistory,\n                    semantic_processed: vision_updated,\n                }\n            })\n        };\n\n        let snapshot = self.live_context.snapshot();\n        let mut world_compact = snapshot.compact_for_agents(1_400);\n        if let Some(ambient) = ambient_observation.as_ref() {\n            world_compact.push('\\n');\n            world_compact.push_str(&ambient.compact_evidence_line());\n        }\n        world_compact.push('\\n');\n        world_compact.push_str(&perception_runtime_line(\n            &perception_health,\n            perception_metrics,\n        ));\n\n        let observation = ScreenObservation {\n            // Caption only (spec §4.10). Compact ambient evidence rides the\n            // existing world/context channel and therefore reaches raw-frame\n            // provenance without adding pixels or text to triage prompts.\n            description: caption,\n            world_compact: Some(world_compact),''')
          replace_one(path, '''        match tx.try_send(observation) {\n            Ok(()) => {}''', '''        perception_metrics.last_observation_emit_latency_us = Utc::now()\n            .signed_duration_since(packet.captured_at)\n            .num_microseconds()\n            .unwrap_or(i64::MAX)\n            .max(0) as u64;\n        match tx.try_send(observation) {\n            Ok(()) => {}''')
          replace_one(path, '''fn change_signature(image: &image::RgbaImage) -> Vec<u8> {''', '''fn perception_sensitivity(privacy: PrivacyDisposition) -> PerceptionSensitivity {\n    match privacy {\n        PrivacyDisposition::Visible => PerceptionSensitivity::CloudAllowed,\n        PrivacyDisposition::Redacted => PerceptionSensitivity::LocalOnly,\n        PrivacyDisposition::Excluded => PerceptionSensitivity::NeverObserve,\n    }\n}\n\nfn duration_micros_u64(duration: Duration) -> u64 {\n    duration.as_micros().min(u128::from(u64::MAX)) as u64\n}\n\nfn perception_runtime_line(\n    health: &PerceptionHealth,\n    metrics: &PerceptionMetrics,\n) -> String {\n    format!(\n        "[perception] health={health:?} captured={} exact_dedup={} low_change={} semantic_inferences={} gate_evictions={} capture_us={} change_us={} inference_us={} emit_us={}",\n        metrics.frames_captured,\n        metrics.exact_duplicates_discarded,\n        metrics.low_change_discarded,\n        metrics.semantic_inferences,\n        metrics.gate_state_evictions,\n        metrics.last_capture_latency_us,\n        metrics.last_change_detection_latency_us,\n        metrics.last_inference_latency_us,\n        metrics.last_observation_emit_latency_us\n    )\n}\n\nfn change_signature(image: &image::RgbaImage) -> Vec<u8> {''')
          replace_one(path, '''    #[test]\n    fn luma_difference_ignores_identical_frames() {''', '''    #[test]\n    fn privacy_disposition_bridge_is_exhaustive_and_fail_closed() {\n        assert_eq!(\n            perception_sensitivity(PrivacyDisposition::Visible),\n            PerceptionSensitivity::CloudAllowed\n        );\n        assert_eq!(\n            perception_sensitivity(PrivacyDisposition::Redacted),\n            PerceptionSensitivity::LocalOnly\n        );\n        assert_eq!(\n            perception_sensitivity(PrivacyDisposition::Excluded),\n            PerceptionSensitivity::NeverObserve\n        );\n    }\n\n    #[test]\n    fn luma_difference_ignores_identical_frames() {''')

          # Event bridge: convert A2 observation sensitivity to the existing event
          # vocabulary exhaustively. never_observe has no event representation.
          path = "crates/continuum-core/src/triage/consume.rs"
          replace_one(path, '''use continuum_memory::{NodeStatus, NodeType, NoteDraft, Source, Vault};''', '''use continuum_memory::{NodeStatus, NodeType, NoteDraft, Source, Vault};\nuse continuum_vision::perception::Sensitivity as PerceptionSensitivity;''')
          replace_one(path, '''    let sensitivity = match zone {\n        Zone::LocalOnly => EventSensitivity::LocalOnly,\n        _ => EventSensitivity::CloudAllowed,\n    };''', '''    let observation_sensitivity = match zone {\n        Zone::CloudAllowed => PerceptionSensitivity::CloudAllowed,\n        Zone::LocalOnly => PerceptionSensitivity::LocalOnly,\n        Zone::NeverObserve => PerceptionSensitivity::NeverObserve,\n    };\n    let sensitivity = event_sensitivity_from_perception(observation_sensitivity)\n        .expect("never_observe returned before event construction");''')
          replace_one(path, '''/// Truncates a summary into a vault title: char-boundary safe, trimmed,''', '''/// Total bridge from A2's three-state observation sensitivity to the\n/// two-state persisted event vocabulary. `never_observe` returns `None`\n/// because such an event row is forbidden by construction.\npub fn event_sensitivity_from_perception(\n    sensitivity: PerceptionSensitivity,\n) -> Option<EventSensitivity> {\n    match sensitivity {\n        PerceptionSensitivity::CloudAllowed => Some(EventSensitivity::CloudAllowed),\n        PerceptionSensitivity::LocalOnly => Some(EventSensitivity::LocalOnly),\n        PerceptionSensitivity::NeverObserve => None,\n    }\n}\n\n/// Truncates a summary into a vault title: char-boundary safe, trimmed,''')
          replace_one(path, '''    #[test]\n    fn''', '''    #[test]\n    fn perception_event_sensitivity_bridge_is_total() {\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::CloudAllowed),\n            Some(EventSensitivity::CloudAllowed)\n        );\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::LocalOnly),\n            Some(EventSensitivity::LocalOnly)\n        );\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::NeverObserve),\n            None\n        );\n    }\n\n    #[test]\n    fn''')

          # Keep the changelog precise about what is runtime-wired versus external.
          path = "docs/changelog/2026-08-10-a2-ambient-perception.md"
          Path(path).write_text('''# A2 — efficient ambient perception and vision context\n\n- Added privacy-gated SHA-256 frame identity plus brightness-sensitive perceptual change detection; `never_observe` returns before hashing or semantic selection.\n- Added a bounded per-display/per-region second-stage gate behind the existing 64×36 luma prefilter, with deterministic LRU eviction and time-based fallback refresh.\n- Wired the gate into the real `xcap` watcher without creating a second capture loop; selected compact observation provenance and real perception metrics/health now ride the existing `world_compact` channel and therefore persist with raw-frame/context-event provenance without storing pixels.\n- Added stable occurrence ids distinct from content identity, capture timestamps, display keys, strong content digest, change score, semantic-processing flag, confidence, source, sensitivity and retention metadata.\n- Added explicit observation→event sensitivity conversion: `cloud_allowed` and `local_only` map exhaustively; `never_observe` has no event representation.\n- Added explicit health states for observing, disabled, paused, stale, permission-required, encoder-unavailable, unavailable, degraded, processing, error and historical-capture-disabled conditions.\n- Added strict retention helpers: `Ephemeral` and `DoNotPersist` are non-persistable; `local_only` is not an automatic durable-memory candidate; `never_observe` is neither semantically cacheable nor persistable.\n- Added runtime counters for capture/change/inference/emission latency, redundant selected packets, inference frequency, buffer drops and gate-state evictions. CPU/GPU/memory remain owned by the runtime-health subsystem.\n- Added synthetic tests for privacy-before-processing spies, duplicate/fallback behavior, uniform full-screen brightness changes, frame-shape identity, multi-monitor isolation, bounded state, cache-key sensitivity/revision identity, all privacy×retention combinations, occurrence provenance, event sensitivity mapping and health states.\n- Added a reproducible synthetic `perception_gate_bench` example. Its output measures only fingerprint/change-gate overhead and makes no Windows/native capture or ONNX performance claim.\n\nA7 coordination: A2 exports only inner, text-free encoder/content identity. It is not a safe cross-scope cache by itself; privacy generation, profile/project scope, TTL/byte bounds and invalidation remain the shared cache owner's responsibility.\n\nIntegration note: fold this entry into the root `CHANGELOG.md` once when the swarm branches are integrated.\n''')
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "continuum-swarm-a2"
          git config user.email "actions@users.noreply.github.com"
          git add crates/continuum-vision crates/continuum-core/src/senses/vision.rs crates/continuum-core/src/triage/consume.rs docs/changelog/2026-08-10-a2-ambient-perception.md
          git diff --cached --check
          git commit -m "feat(vision): wire privacy-gated ambient evidence [a2-runtime-patched]"
          git push origin HEAD:swarm/a2-ambient-perception
