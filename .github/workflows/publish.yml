name: Publish release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuum-publish-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  prepare:
    name: Prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tested source and release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          if [ "$source_sha" != "$main_sha" ]; then
            echo "Tested source $source_sha was superseded by main $main_sha; nothing will be published."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)"
          increment() {
            local value="$1"
            if [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z][A-Za-z0-9-]*)\.([0-9]+)$ ]]; then
              printf '%s-%s.%s' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$((BASH_REMATCH[3] + 1))"
            elif [[ "$value" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              printf '%s.%s.%s' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$((BASH_REMATCH[3] + 1))"
            else
              echo "Unsupported SemVer in Cargo.toml: $value" >&2
              return 1
            fi
          }

          # Resume an interrupted publication only when the existing tag points
          # at this exact tested main commit. A stale tag must never receive new
          # binaries built from a different source tree.
          current_tag="v$current"
          current_tag_sha=""
          if git rev-parse "$current_tag" >/dev/null 2>&1; then
            current_tag_sha="$(git rev-list -n1 "$current_tag")"
          fi
          if [ "$current_tag_sha" = "$source_sha" ] && ! gh release view "$current_tag" >/dev/null 2>&1; then
            version="$current"
          else
            version="$(increment "$current")"
          fi

          while git rev-parse "v$version" >/dev/null 2>&1 || gh release view "v$version" >/dev/null 2>&1; do
            version="$(increment "$version")"
          done

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version from $source_sha"

  build-windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify bundle configuration
        shell: pwsh
        run: |
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if (@($config.bundle.targets) -notcontains "nsis") { throw "NSIS target is missing." }
          if ($config.bundle.createUpdaterArtifacts -ne $true) { throw "Updater artifacts are disabled." }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native prerequisites
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) { choco install llvm --no-progress --confirm }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV
          choco install ninja protoc --no-progress --confirm

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required."
          }

      - name: Apply release version
        shell: pwsh
        run: .\scripts\bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and governed sidecars
        run: cargo build --release --locked --bin continuum --bin continuum-mcp --bin continuum-agent-os

      - name: Stage desktop resources
        shell: pwsh
        run: |
          $bin = "apps/desktop/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "target/release/continuum.exe" "$bin/continuum.exe" -Force
          Copy-Item "target/release/continuum-mcp.exe" "$bin/continuum-mcp.exe" -Force
          Copy-Item "target/release/continuum-agent-os.exe" "$bin/continuum-agent-os.exe" -Force

      - name: Build signed NSIS installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Collect and verify Windows assets
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $assets = "release-assets"
          $stage = "staging/continuum-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $assets,$stage | Out-Null
          Copy-Item "target/release/continuum.exe","target/release/continuum-mcp.exe","target/release/continuum-agent-os.exe" $stage
          Copy-Item config "$stage/config" -Recurse
          Copy-Item prompts "$stage/prompts" -Recurse
          Copy-Item skills "$stage/skills" -Recurse
          Copy-Item README.md,LICENSE,KNOWN_ISSUES.md $stage
          Copy-Item scripts/install.ps1 "$stage/install.ps1"
          Compress-Archive -Path "$stage/*" -DestinationPath "$assets/continuum-$version-windows-x64.zip" -Force

          $installers = @(Get-ChildItem "target/release/bundle/nsis" -File -Filter "*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Name -join ', ')"
          }
          $signature = Get-Item "$($installers[0].FullName).sig" -ErrorAction Stop
          Copy-Item $installers[0].FullName "$assets/continuum-$version-windows-x64-setup.exe"
          Copy-Item $signature.FullName "$assets/continuum-$version-windows-x64-setup.exe.sig"

          foreach ($file in @(
            "$assets/continuum-$version-windows-x64.zip",
            "$assets/continuum-$version-windows-x64-setup.exe",
            "$assets/continuum-$version-windows-x64-setup.exe.sig"
          )) {
            if (-not (Test-Path $file -PathType Leaf) -or (Get-Item $file).Length -eq 0) {
              throw "Missing or empty release asset: $file"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            uname: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify runner and bundle configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname }}"
          jq -e '.bundle.targets | index("dmg")' apps/desktop/src-tauri/tauri.conf.json >/dev/null
          jq -e '.bundle.createUpdaterArtifacts == true' apps/desktop/src-tauri/tauri.conf.json >/dev/null

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - run: brew install ninja protobuf llvm

      - name: Configure LLVM
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Apply release version
        shell: pwsh
        run: ./scripts/bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and governed sidecars
        run: cargo build --release --locked --target ${{ matrix.target }} --bin continuum --bin continuum-mcp --bin continuum-agent-os

      - name: Stage desktop resources
        shell: bash
        run: |
          set -euo pipefail
          bin="apps/desktop/src-tauri/resources/bin"
          mkdir -p "$bin"
          cp "target/${{ matrix.target }}/release/continuum" "$bin/continuum"
          cp "target/${{ matrix.target }}/release/continuum-mcp" "$bin/continuum-mcp"
          cp "target/${{ matrix.target }}/release/continuum-agent-os" "$bin/continuum-agent-os"
          chmod +x "$bin/continuum" "$bin/continuum-mcp" "$bin/continuum-agent-os"

      # `dmg` alone does not create the updater-enabled .app.tar.gz. Building
      # both targets is required for a user-facing DMG and Tauri auto-updates.
      - name: Build signed app bundle and DMG
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg --target ${{ matrix.target }}

      - name: Collect and verify macOS assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ needs.prepare.outputs.version }}"
          arch="${{ matrix.arch }}"
          target="${{ matrix.target }}"
          assets="release-assets"
          stage="staging/continuum-$version-macos-$arch"
          mkdir -p "$assets" "$stage"
          cp "target/$target/release/continuum" "$stage/"
          cp "target/$target/release/continuum-mcp" "$stage/"
          cp "target/$target/release/continuum-agent-os" "$stage/"
          cp -R config "$stage/config"
          cp -R prompts "$stage/prompts"
          cp -R skills "$stage/skills"
          cp README.md LICENSE KNOWN_ISSUES.md "$stage/"
          tar -C staging -czf "$assets/continuum-$version-macos-$arch.tar.gz" "continuum-$version-macos-$arch"

          dmgs=(target/$target/release/bundle/dmg/*.dmg)
          updaters=(target/$target/release/bundle/macos/*.app.tar.gz)
          if [ "${#dmgs[@]}" -ne 1 ] || [ "${#updaters[@]}" -ne 1 ]; then
            echo "Expected one DMG and one updater archive for $target" >&2
            find "target/$target/release/bundle" -type f -print >&2 || true
            exit 1
          fi
          test -s "${updaters[0]}.sig"
          cp "${dmgs[0]}" "$assets/continuum-$version-macos-$arch.dmg"
          cp "${updaters[0]}" "$assets/continuum-$version-macos-$arch.app.tar.gz"
          cp "${updaters[0]}.sig" "$assets/continuum-$version-macos-$arch.app.tar.gz.sig"

          for file in \
            "$assets/continuum-$version-macos-$arch.tar.gz" \
            "$assets/continuum-$version-macos-$arch.dmg" \
            "$assets/continuum-$version-macos-$arch.app.tar.gz" \
            "$assets/continuum-$version-macos-$arch.app.tar.gz.sig"; do
            test -s "$file" || { echo "Missing or empty release asset: $file" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate complete asset matrix
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          required=(
            "continuum-$version-windows-x64.zip"
            "continuum-$version-windows-x64-setup.exe"
            "continuum-$version-windows-x64-setup.exe.sig"
            "continuum-$version-macos-aarch64.tar.gz"
            "continuum-$version-macos-aarch64.dmg"
            "continuum-$version-macos-aarch64.app.tar.gz"
            "continuum-$version-macos-aarch64.app.tar.gz.sig"
            "continuum-$version-macos-x86_64.tar.gz"
            "continuum-$version-macos-x86_64.dmg"
            "continuum-$version-macos-x86_64.app.tar.gz"
            "continuum-$version-macos-x86_64.app.tar.gz.sig"
          )
          for asset in "${required[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Release blocked: missing or empty release-assets/$asset" >&2
              find release-assets -maxdepth 1 -type f -print >&2
              exit 1
            }
          done

      - name: Create updater manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          repo="${{ github.repository }}"
          cd release-assets
          win_sig="$(tr -d '\r\n' < "continuum-$version-windows-x64-setup.exe.sig")"
          arm_sig="$(tr -d '\r\n' < "continuum-$version-macos-aarch64.app.tar.gz.sig")"
          intel_sig="$(tr -d '\r\n' < "continuum-$version-macos-x86_64.app.tar.gz.sig")"
          jq -n \
            --arg version "$version" \
            --arg notes "Automatic Continuum release $tag." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$repo" \
            --arg tag "$tag" \
            --arg win_sig "$win_sig" \
            --arg arm_sig "$arm_sig" \
            --arg intel_sig "$intel_sig" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $win_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-windows-x64-setup.exe")}, "darwin-aarch64": {signature: $arm_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-macos-aarch64.app.tar.gz")}, "darwin-x86_64": {signature: $intel_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-macos-x86_64.app.tar.gz")}}}' > latest.json
          sha256sum * > SHA256SUMS.txt
          cp latest.json ../latest.json

      - name: Refuse stale publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "${{ needs.prepare.outputs.source_sha }}" || {
            echo "Main changed while release assets were building; refusing to publish stale binaries." >&2
            exit 1
          }

      - name: Apply release version
        shell: pwsh
        run: ./scripts/bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"

      - name: Commit metadata and tag tested source
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          git checkout -B release-metadata "${{ needs.prepare.outputs.source_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/lib/tauri.ts latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare $tag [skip ci]"
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Tag $tag already points at a different commit." >&2
              exit 1
            }
          else
            git tag -a "$tag" -m "Continuum $tag"
          fi
          git push origin HEAD:main "refs/tags/$tag"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Continuum ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
          body: |
            ## Continuum ${{ needs.prepare.outputs.tag }}

            Automatically built from a successful CI run on `main`.

            Validated before publication:
            - Windows x64 NSIS installer and updater signature
            - Apple Silicon macOS DMG and signed updater archive
            - Intel macOS DMG and signed updater archive
            - Continuum runtime, context MCP and governed Agent OS sidecars

            On macOS, download the DMG matching the processor architecture.
