name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Compiler version validated against the committed Cargo.lock.
  RUST_VERSION: "1.94.0"
  # Always land cargo artifacts under `target/` relative to the workspace.
  # Overrides the committed .cargo/config.toml hint when needed.
  CARGO_TARGET_DIR: target
  # sccache caching is opt-in at the job level via RUSTC_WRAPPER; turning
  # it on workflow-wide broke pre-install steps with "program not found".
  SCCACHE_CACHE_SIZE: "2G"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy-light:
    name: Clippy (light path — no native deps)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Clippy (continuum-core no-default-features)
        # The "light" path is what the Tauri dashboard consumes: continuum-core
        # without runtime, no llama-cpp / whisper-rs-sys / ort / lancedb
        # build scripts, no native toolchain needed.
        run: cargo clippy -p continuum-core --no-default-features --lib --tests -- -D warnings

      - name: Clippy (continuum-desktop)
        run: cargo clippy -p continuum-desktop --no-deps -- -D warnings

  clippy-full:
    # Exhaustive native linting runs on every push to main so PR authors see
    # failures before review and main stays green at all times.
    name: Clippy (full workspace — with native deps)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      # LLVM ships pre-installed on windows-latest at C:\Program Files\LLVM;
      # point the whisper-rs-sys bindgen at it and override the committed
      # maintainer-local default of C:\LLVM\bin.
      - name: Configure LLVM for bindgen
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm --no-progress --confirm
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV

      - name: Install ninja
        shell: pwsh
        run: choco install ninja --no-progress --confirm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native build prerequisites
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          protoc --version
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH "libclang.dll"))) {
            throw "libclang.dll was not found under LIBCLANG_PATH=$env:LIBCLANG_PATH"
          }

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-
            ${{ runner.os }}-cargo-registry-

      - name: Clippy (full workspace)
        # Full-workspace clippy hits whisper-rs-sys, llama-cpp-sys, ort,
        # and lancedb build scripts. The toolchain install steps above
        # are required or this fails during bindgen.
        run: cargo clippy --workspace --all-targets -- -D warnings

  full-test:
    # Full workspace test runs on every push to main. The native build cache
    # makes the second run cheap; this keeps main green at all times.
    name: Full test suite
    runs-on: windows-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Configure LLVM for bindgen
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm --no-progress --confirm
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV

      - name: Install ninja
        shell: pwsh
        run: choco install ninja --no-progress --confirm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native build prerequisites
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          protoc --version
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH "libclang.dll"))) {
            throw "libclang.dll was not found under LIBCLANG_PATH=$env:LIBCLANG_PATH"
          }

      # The full Clippy job owns writes for this shared native cache key. This
      # test job runs in parallel and must only restore it; otherwise both jobs
      # can spend many minutes compressing/uploading the same multi-GB target.
      - name: Restore cargo artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-
            ${{ runner.os }}-cargo-registry-

      # Light tests: the lib test path for continuum-core without runtime. Fast,
      # covers the UTF-8 / sentence-split / config / permissions code that
      # doesn't need a native toolchain.
      - name: Run tests (light path)
        run: cargo test -p continuum-core --no-default-features --lib

      - name: Run tests (full workspace)
        # The score module contains integration-style benchmarks that drive
        # concurrent frame and event writes against one SQLite database. They
        # remain mandatory, but receive their own single-thread scheduling
        # window below so runner load cannot turn commit timing into a flaky
        # product signal. Every other workspace test remains parallel here.
        run: "cargo test --workspace -- --skip bench::score::tests::"

      - name: Run context-engine benchmark gates (isolated)
        run: "cargo test -p continuum-core bench::score::tests:: -- --test-threads=1"

  build-desktop:
    name: Build desktop
    runs-on: windows-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-

      - name: Install frontend dependencies (pnpm workspace root)
        run: pnpm install --frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app (debug)
        # Debug build is faster for CI and still validates the Rust side compiles.
        # Release bundling happens in release.yml. Desktop depends on
        # continuum-core with default-features = false, so no native toolchain needed.
        run: cargo build -p continuum-desktop

  build-desktop-macos:
    name: Build desktop (macOS)
    runs-on: macos-14
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-

      - name: Install frontend dependencies (pnpm workspace root)
        run: pnpm install --frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app (debug)
        run: cargo build -p continuum-desktop

  docs-site:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (pnpm workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build
        working-directory: apps/docs
