name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep the latest PR run only. Main runs always finish so the separate
  # workflow_run release trigger gets a definitive result for the tested SHA.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.11.1"
  CARGO_TARGET_DIR: target
  SCCACHE_CACHE_SIZE: "2G"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run release contract tests
        run: python3 -m unittest -v scripts/test_release_contract.py

      - name: Validate Tauri release configuration
        run: python3 scripts/release_contract.py validate-config --repo-root .

  clippy-light:
    name: Clippy (light path — no native deps)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Clippy (continuum-core no-default-features)
        run: cargo clippy -p continuum-core --no-default-features --lib --tests -- -D warnings

      - name: Clippy (continuum-desktop)
        run: cargo clippy -p continuum-desktop --no-deps -- -D warnings

  clippy-full:
    name: Clippy (full workspace — with native deps)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - name: Configure LLVM for bindgen
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm --no-progress --confirm
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV

      - name: Install ninja
        shell: pwsh
        run: choco install ninja --no-progress --confirm

      - name: Install protoc
        shell: pwsh
        run: choco install protoc --no-progress --confirm

      - name: Verify native build prerequisites
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          protoc --version
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH "libclang.dll"))) {
            throw "libclang.dll was not found under LIBCLANG_PATH=$env:LIBCLANG_PATH"
          }

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-
            ${{ runner.os }}-cargo-registry-

      - name: Clippy (full workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

  full-test:
    name: Full test suite
    runs-on: windows-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Configure LLVM for bindgen
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm --no-progress --confirm
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV

      - name: Install ninja
        shell: pwsh
        run: choco install ninja --no-progress --confirm

      - name: Install protoc
        shell: pwsh
        run: choco install protoc --no-progress --confirm

      - name: Verify native build prerequisites
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          protoc --version
          if (-not (Test-Path (Join-Path $env:LIBCLANG_PATH "libclang.dll"))) {
            throw "libclang.dll was not found under LIBCLANG_PATH=$env:LIBCLANG_PATH"
          }

      - name: Restore cargo artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-full-
            ${{ runner.os }}-cargo-registry-

      - name: Run tests (light path)
        run: cargo test -p continuum-core --no-default-features --lib

      - name: Run tests (full workspace)
        run: "cargo test --workspace -- --skip bench::score::tests::"

      - name: Run context-engine benchmark gates (isolated)
        run: "cargo test -p continuum-core bench::score::tests:: -- --test-threads=1"

  build-desktop:
    name: Build desktop (Windows x64)
    runs-on: windows-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app
        run: cargo build -p continuum-desktop

  build-desktop-macos:
    name: Build desktop and Agent OS (macOS Apple Silicon)
    runs-on: macos-15
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v6

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install Agent OS native prerequisites
        run: brew install ninja protobuf llvm

      - name: Configure LLVM for bindgen
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-agent-os-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-agent-os-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app
        run: cargo build -p continuum-desktop

      - name: Build Agent OS binary
        run: cargo build -p continuum-mcp --bin continuum-agent-os

  build-desktop-macos-intel:
    name: Build desktop and Agent OS (macOS Intel)
    runs-on: macos-15-intel
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v6

      - name: Verify runner architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install Agent OS native prerequisites
        run: brew install ninja protobuf llvm

      - name: Configure LLVM for bindgen
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-agent-os-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-desktop-agent-os-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app
        run: cargo build -p continuum-desktop

      - name: Build Agent OS binary
        run: cargo build -p continuum-mcp --bin continuum-agent-os

  docs-site:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: [fmt, clippy-light]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build
        working-directory: apps/docs
