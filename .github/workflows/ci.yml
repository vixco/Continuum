name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Use sccache in CI too; first build is slow, subsequent builds benefit.
  SCCACHE_CACHE_SIZE: "2G"
  RUSTC_WRAPPER: sccache

jobs:
  quick-check:
    name: Quick check (fmt + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # clippy on the workspace without --all-features first; full feature clippy is in the slow job.
        run: cargo clippy --workspace --all-targets -- -D warnings

  full-test:
    name: Full test suite
    runs-on: windows-latest
    needs: quick-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-
            ${{ runner.os }}-cargo-registry-

      # Optional: cache downloaded models for integration tests that need them.
      # Models live outside the repo, so this is keyed on the download script hash.
      - name: Cache models for integration tests
        uses: actions/cache@v4
        with:
          path: ~/.kairo-dev/models
          key: ${{ runner.os }}-kairo-models-${{ hashFiles('scripts/download-models.ps1') }}
          restore-keys: |
            ${{ runner.os }}-kairo-models-

      - name: Run tests
        # Skip the known-failing matches_whisper_k_to_c_homophone test (see KNOWN_ISSUES.md).
        # Prefer --workspace over individual crates so new crates are picked up automatically.
        run: cargo test --workspace -- --skip matches_whisper_k_to_c_homophone

  build-desktop:
    name: Build desktop
    runs-on: windows-latest
    needs: quick-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Install frontend dependencies (pnpm workspace root)
        # Not --frozen-lockfile yet: the ESLint+Prettier devDependencies
        # landed after the lockfile was last pinned; the next lockfile
        # regeneration closes this gap and this flag flips back.
        run: pnpm install --no-frozen-lockfile

      - name: Dashboard type-check
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: Dashboard lint
        run: pnpm lint
        working-directory: apps/desktop
        # Not fatal yet — lint rules were tightened in the security pass,
        # existing code will be cleaned up in follow-up PRs.
        continue-on-error: true

      - name: Dashboard format check
        run: pnpm format
        working-directory: apps/desktop
        # Same rationale as lint — prettier-first pass lands separately.
        continue-on-error: true

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Build Tauri desktop app (debug)
        # Debug build is faster for CI and still validates the Rust side compiles.
        # Release bundling happens in release.yml.
        run: cargo build -p kairo-desktop

  docs-site:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: quick-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (pnpm workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm build
        working-directory: apps/docs
