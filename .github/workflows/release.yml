name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.0"
  # Keep every Cargo invocation in one workspace-level directory. Tauri runs
  # Cargo from src-tauri, so a relative value creates a second target tree and
  # leaves the asset assembly step looking in the wrong place.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # sccache wraps rustc/cc; mozilla-actions/sccache-action (run later) manages
  # SCCACHE_DIR + the GitHub Actions cache backing. These are plain values,
  # so workflow-level env is valid (no `runner` context needed here).
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 4G
  # Route the cmake-built native libs (whisper.cpp + llama.cpp) through sccache.
  # RUSTC_WRAPPER alone only caches rustc — the slow 15-20 min is the C/C++
  # compile of those two libs. cmake reads CMAKE_<LANG>_COMPILER_LAUNCHER from
  # the env and runs `sccache cl` for each translation unit, so after the first
  # release they become cache hits.
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  release:
    name: Build and publish Windows release
    # Never publish a main commit until the blocking CI workflow has passed.
    # Manual dispatch remains available for an intentional retry.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Keep the native toolchain stable. Packaging itself is NSIS-only because
    # WiX 3 candle.exe fails to start on multiple hosted Windows images.
    runs-on: windows-2022
    # sccache wraps rustc/cc so whisper.cpp + llama.cpp + ort + lancedb native
    # compiles are cache hits across releases. First release is full speed;
    # every subsequent release reuses the C/C++ objects in seconds. The
    # mozilla-actions/sccache-action manages SCCACHE_DIR + GitHub Actions
    # cache restore/save itself, so only the wrapper flag and size are set
    # here (plain values, valid in workflow-level env). The wrapper is
    # installed before the first cargo build below, so it never poisons an
    # earlier cargo step.
    concurrency:
      group: continuum-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run otherwise checks out the latest default-branch SHA,
          # which may differ from the exact commit that CI validated.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release commit is current main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $releaseSha = (git rev-parse HEAD).Trim()
          $mainSha = (git rev-parse origin/main).Trim()
          if ($releaseSha -ne $mainSha) {
            throw "Refusing to release stale CI commit $releaseSha; current main is $mainSha."
          }

      - name: Verify NSIS-only packaging contract
        shell: pwsh
        run: |
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $targets = @($config.bundle.targets)
          if ($targets.Count -ne 1 -or $targets[0] -ne "nsis") {
            throw "Release packaging must remain NSIS-only; configured targets: $($targets -join ', ')"
          }

      - name: Calculate next release version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content "Cargo.toml" | Select-String '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "Could not find the workspace version in Cargo.toml" }
          $current = $line.Matches[0].Groups[1].Value
          if ($current -match '^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z][A-Za-z0-9-]*)\.([0-9]+)$') {
            $base = $Matches[1]
            $channel = $Matches[2]
            $nextNumber = [int]$Matches[3] + 1
            $next = "$base-$channel.$nextNumber"
          } elseif ($current -match '^([0-9]+)\.([0-9]+)\.([0-9]+)$') {
            $next = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          } else {
            throw "Unsupported SemVer in Cargo.toml: $current"
          }

          while (git tag --list "v$next") {
            if ($next -match '^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z][A-Za-z0-9-]*)\.([0-9]+)$') {
              $next = "$($Matches[1])-$($Matches[2]).$([int]$Matches[3] + 1)"
            } else {
              throw "Release tag v$next already exists; bump the source version manually."
            }
          }

          "version=$next" >> $env:GITHUB_OUTPUT
          "tag=v$next" >> $env:GITHUB_OUTPUT
          Write-Host "Current source version: $current"
          Write-Host "Next release version: $next"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # whisper-rs-sys bindgen needs libclang. windows-2022 ships LLVM, but
      # pin the path explicitly (mirrors ci.yml clippy-full) so an image change
      # never silently breaks the release build at the bindgen step.
      - name: Configure LLVM + ninja for bindgen / cmake
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) { choco install llvm --no-progress --confirm }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV
          choco install ninja --no-progress --confirm --skip-if-not-installed

      - name: Install sccache
        # Pinned to a real tag: this action publishes only `v0.0.x` tags (no
        # moving `v0` major ref), so `@v0` is unresolvable and fails the whole
        # workflow run before any job starts. Bump explicitly when upgrading.
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure updater signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured. Signed updater releases cannot be published safely."
          }

      - name: Bump version in release checkout
        shell: pwsh
        run: .\scripts\bump-version.ps1 -NewVersion "${{ steps.version.outputs.version }}"

      # Cache failure must never block a signed release. The stable restore key
      # reuses native dependencies across incrementing alpha versions.
      - name: Restore release compiler cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-release-

      # CI is the test gate. Build only the dep graph of the two shipped bins
      # (continuum + continuum-mcp); continuum-gateway and the Tauri desktop
      # crate are not deps of either bin and are built in their own step.
      # sccache (set via RUSTC_WRAPPER in the job env) turns the whisper.cpp /
      # llama.cpp / ort / lancedb native compiles into cache hits after the
      # first release.
      - name: Build release binaries
        run: cargo build --release --locked --bin continuum --bin continuum-mcp

      - name: Build Tauri desktop app with signed updater artifacts
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Defense in depth: never invoke WiX even if the config later drifts.
        run: pnpm tauri build --bundles nsis

      - name: Assemble release assets and updater metadata
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $stage = "staging\continuum-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target\release\continuum.exe" "$stage\"
          Copy-Item "target\release\continuum-mcp.exe" "$stage\"
          $desktop = Get-ChildItem "target\release" -Filter "continuum-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($desktop) { Copy-Item $desktop.FullName "$stage\" }
          Copy-Item "config" "$stage\config" -Recurse
          Copy-Item "prompts" "$stage\prompts" -Recurse
          Copy-Item "skills" "$stage\skills" -Recurse
          Copy-Item "README.md" "$stage\"
          Copy-Item "LICENSE" "$stage\"
          Copy-Item "KNOWN_ISSUES.md" "$stage\"
          Copy-Item "scripts\install.ps1" "$stage\install.ps1"
          $portable = "continuum-$version-windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $portable -Force

          $bundleRoot = "target\release\bundle"
          $nsis = Get-ChildItem "$bundleRoot\nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "Tauri did not produce an NSIS setup executable" }
          $nsisSig = Get-Item "$($nsis.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $nsisSig) { throw "Tauri did not produce an updater signature for $($nsis.Name)" }

          $installerName = "continuum-$version-windows-x64-setup.exe"
          $signatureName = "$installerName.sig"
          Copy-Item $nsis.FullName $installerName
          Copy-Item $nsisSig.FullName $signatureName
          $signature = (Get-Content $nsisSig.FullName -Raw).Trim()
          $latest = [ordered]@{
            version = $version
            notes = "Automatic Continuum release $tag. See the GitHub release notes for details."
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/$installerName"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8NoBOM

          $shaFiles = @($portable, $installerName, $signatureName, "latest.json")
          $shaLines = foreach ($file in $shaFiles) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $shaLines | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii

          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "signature_name=$signatureName" >> $env:GITHUB_OUTPUT
          Get-Content "latest.json"
          Get-Content "SHA256SUMS.txt"

      - name: Commit version and updater metadata to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/lib/tauri.ts latest.json
          git commit -m "chore(release): prepare ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Continuum ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Continuum ${{ steps.version.outputs.tag }}
          draft: false
          # Continuum publishes every successful main build as a normal GitHub
          # Release, including alpha/beta SemVer tags, so it remains visible as
          # the latest release and is discoverable from the Releases page.
          prerelease: false
          generate_release_notes: true
          files: |
            continuum-${{ steps.version.outputs.version }}-windows-x64.zip
            ${{ steps.assets.outputs.installer_name }}
            ${{ steps.assets.outputs.signature_name }}
            latest.json
            SHA256SUMS.txt
          body: |
            ## Continuum ${{ steps.version.outputs.tag }}

            This release was published automatically after a successful push to `main`.
            The Windows updater artifact is signed and is described by `latest.json`.

            **Install from this release:**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.tag }}/scripts/install.ps1 | iex
            ```

            Windows binaries remain unsigned; Windows SmartScreen may warn on first launch.
