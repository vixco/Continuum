name: Release

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact main commit that passed the complete CI graph
        required: true
        type: string
      version:
        description: Optional explicit SemVer for a manual recovery release
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit SemVer; leave empty for automatic selection
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: continuum-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.11.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "2"

jobs:
  prepare:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      source_sha: ${{ steps.current.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      recovering: ${{ steps.version.outputs.recovering }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      already_published: ${{ steps.version.outputs.already_published }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Confirm this is still the current main commit
        id: current
        env:
          REQUESTED_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Commit $source_sha was superseded by main commit $main_sha; the newer CI run owns release publication."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        if: steps.current.outputs.should_release == 'true'
        run: python3 scripts/release_contract.py validate-config --repo-root .

      - name: Fail early when updater signing is unavailable
        if: steps.current.outputs.should_release == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required to publish signed updater artifacts." >&2
            exit 1
          }

      - name: Read complete and partial GitHub Releases
        if: steps.current.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/releases.ndjson"
          page=1
          while true; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=$page")"
            count="$(jq 'length' <<< "$response")"
            jq -c '.[]' <<< "$response" >> "$RUNNER_TEMP/releases.ndjson"
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          python3 scripts/release_contract.py complete-tags \
            --release-json-lines "$RUNNER_TEMP/releases.ndjson" \
            --output "$RUNNER_TEMP/complete-release-tags.txt"

      - name: Select or recover release version
        if: steps.current.outputs.should_release == 'true'
        id: version
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.current.outputs.source_sha }}
        run: |
          set -euo pipefail
          args=(
            next-version
            --repo-root .
            --source-sha "$SOURCE_SHA"
            --published-tags-file "$RUNNER_TEMP/complete-release-tags.txt"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "${EXPLICIT_VERSION:-}" ]; then
            args+=(--version "$EXPLICIT_VERSION")
          fi
          python3 scripts/release_contract.py "${args[@]}"

      - name: Decide whether publication work is needed
        id: gate
        if: always()
        env:
          CURRENT: ${{ steps.current.outputs.should_release }}
          ALREADY_PUBLISHED: ${{ steps.version.outputs.already_published }}
        run: |
          if [ "$CURRENT" = "true" ] && [ "$ALREADY_PUBLISHED" != "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release plan summary
        if: steps.current.outputs.should_release == 'true'
        run: |
          {
            echo "## Release plan"
            echo
            echo "- Source: \`${{ steps.current.outputs.source_sha }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Recovering existing tag: \`${{ steps.version.outputs.recovering }}\`"
            echo "- Already completely published: \`${{ steps.version.outputs.already_published }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows x64 release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native prerequisites
        shell: pwsh
        run: |
          choco install protoc ninja --no-progress --confirm
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            choco install llvm --no-progress --confirm
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV

      - name: Cache Rust release artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-cargo-release-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and validate release version
        shell: pwsh
        run: |
          .\scripts\bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"
          python scripts/release_contract.py validate-version --repo-root . --version "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and both MCP binaries
        run: cargo build --release --locked --bin continuum --bin continuum-mcp --bin continuum-agent-os

      - name: Stage runtime resources
        shell: pwsh
        run: |
          $binDir = "apps/desktop/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "target/release/continuum.exe" "$binDir/continuum.exe" -Force
          Copy-Item "target/release/continuum-mcp.exe" "$binDir/continuum-mcp.exe" -Force
          Copy-Item "target/release/continuum-agent-os.exe" "$binDir/continuum-agent-os.exe" -Force

      - name: Clean stale bundle artifacts
        # The Rust target cache (restored above) can carry over bundle outputs
        # from a previous version's build — e.g. an old *-setup.exe from the
        # last alpha. Tauri does not delete stale installers, so the "exactly
        # one NSIS installer" assertion below then sees two and fails. Drop the
        # whole bundle dir before the build so only this run's artifacts exist.
        shell: pwsh
        run: |
          $bundleDir = "target/release/bundle"
          if (Test-Path $bundleDir) {
            Remove-Item -Recurse -Force $bundleDir
          }

      - name: Build signed NSIS installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Assemble Windows assets
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $assets = "release-assets"
          $stage = "staging/continuum-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $assets,$stage | Out-Null
          Copy-Item "target/release/continuum.exe" "$stage/"
          Copy-Item "target/release/continuum-mcp.exe" "$stage/"
          Copy-Item "target/release/continuum-agent-os.exe" "$stage/"
          Copy-Item "config" "$stage/config" -Recurse
          Copy-Item "prompts" "$stage/prompts" -Recurse
          Copy-Item "skills" "$stage/skills" -Recurse
          Copy-Item "README.md","LICENSE","KNOWN_ISSUES.md","SECURITY.md" "$stage/"
          Copy-Item "scripts/install.ps1" "$stage/install.ps1"
          Compress-Archive -Path "$stage/*" -DestinationPath "$assets/continuum-$version-windows-x64.zip" -Force

          $installers = @(Get-ChildItem "target/release/bundle/nsis" -File -Filter "*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Name -join ', ')"
          }
          $signature = Get-Item "$($installers[0].FullName).sig" -ErrorAction Stop
          Copy-Item $installers[0].FullName "$assets/continuum-$version-windows-x64-setup.exe"
          Copy-Item $signature.FullName "$assets/continuum-$version-windows-x64-setup.exe.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.arch }} release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            expected_uname: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            expected_uname: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_uname }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Install native prerequisites
        run: brew install ninja protobuf llvm

      - name: Configure LLVM for bindgen
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cache Rust release artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-rust-${{ env.RUST_VERSION }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-${{ env.RUST_VERSION }}-cargo-release-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and validate release version
        shell: pwsh
        run: |
          ./scripts/bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"
          python3 scripts/release_contract.py validate-version --repo-root . --version "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and both MCP binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin continuum --bin continuum-mcp --bin continuum-agent-os

      - name: Stage runtime resources
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
          cp "target/${{ matrix.target }}/release/continuum" apps/desktop/src-tauri/resources/bin/continuum
          cp "target/${{ matrix.target }}/release/continuum-mcp" apps/desktop/src-tauri/resources/bin/continuum-mcp
          cp "target/${{ matrix.target }}/release/continuum-agent-os" apps/desktop/src-tauri/resources/bin/continuum-agent-os
          chmod +x \
            apps/desktop/src-tauri/resources/bin/continuum \
            apps/desktop/src-tauri/resources/bin/continuum-mcp \
            apps/desktop/src-tauri/resources/bin/continuum-agent-os

      - name: Clean stale bundle artifacts
        # Same reason as the Windows job: the restored target cache can carry
        # over a prior version's DMG / .app.tar.gz updater archive, which would
        # break the "exactly one DMG" / "exactly one updater archive" assertions
        # below. Tauri does not prune stale bundle outputs, so we drop the whole
        # bundle dir first and let the build repopulate it cleanly.
        run: rm -rf "target/${{ matrix.target }}/release/bundle"

      - name: Build signed DMG and updater archive
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg --target "${{ matrix.target }}"

      - name: Ad-hoc sign .app and rebuild DMG
        # No Apple Developer ID is configured yet, so Tauri leaves the .app
        # without a trusted signature. We deep ad-hoc sign the bundle —
        # including the staged continuum / continuum-mcp / continuum-agent-os
        # Mach-Os in Resources/bin — so that once a user strips the download
        # quarantine flag (see KNOWN_ISSUES.md) codesign --verify passes and
        # the runtime can exec its bundled binaries without a broken-seal
        # "damaged" error. Ad-hoc signing is NOT a Gatekeeper trust anchor;
        # only Apple notarization removes the first-launch warning. The DMG is
        # then rebuilt from the signed .app so the published installer carries
        # the consistent signature.
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          app_dir="target/$target/release/bundle/macos"
          dmg_dir="target/$target/release/bundle/dmg"
          app="$(find "$app_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app" || { echo "No .app found under $app_dir" >&2; exit 1; }

          # Deep ad-hoc sign the whole bundle, innermost-first, so every
          # nested Mach-O (helper binaries, the staged runtime) gets a
          # signature before its parent is sealed.
          find "$app" -type f -perm +111 -exec file {} + \
            | awk -F: '/Mach-O/{print $1}' \
            | while read -r bin; do codesign --force --sign - "$bin"; done
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # Rebuild the DMG from the now-signed .app so the installer and the
          # bundle it contains stay consistent. Remove the Tauri-produced DMG
          # first to keep the "exactly one DMG" assertion below valid.
          rm -f "$dmg_dir"/*.dmg
          staging="$RUNNER_TEMP/dmg-staging"
          rm -rf "$staging"; mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Continuum" \
            -fs HFS+ \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$dmg_dir/Continuum-${{ needs.prepare.outputs.version }}-$target.dmg"
        shell: bash

      - name: Assemble macOS assets
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          arch="${{ matrix.arch }}"
          assets="release-assets"
          stage="staging/continuum-$version-macos-$arch"
          mkdir -p "$assets" "$stage"
          cp "target/$target/release/continuum" "$stage/"
          cp "target/$target/release/continuum-mcp" "$stage/"
          cp "target/$target/release/continuum-agent-os" "$stage/"
          cp -R config "$stage/config"
          cp -R prompts "$stage/prompts"
          cp -R skills "$stage/skills"
          cp README.md LICENSE KNOWN_ISSUES.md SECURITY.md "$stage/"
          tar -C staging -czf "$assets/continuum-$version-macos-$arch.tar.gz" "continuum-$version-macos-$arch"

          dmg_count="$(find "target/$target/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          updater_count="$(find "target/$target/release/bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          test "$dmg_count" = "1" || {
            echo "Expected exactly one DMG for $target; found $dmg_count" >&2
            find "target/$target/release/bundle" -type f -print >&2
            exit 1
          }
          test "$updater_count" = "1" || {
            echo "Expected exactly one updater archive for $target; found $updater_count" >&2
            find "target/$target/release/bundle" -type f -print >&2
            exit 1
          }
          dmg="$(find "target/$target/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          updater="$(find "target/$target/release/bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -s "$updater.sig" || {
            echo "Missing updater signature $updater.sig" >&2
            exit 1
          }
          cp "$dmg" "$assets/continuum-$version-macos-$arch.dmg"
          cp "$updater" "$assets/continuum-$version-macos-$arch.app.tar.gz"
          cp "$updater.sig" "$assets/continuum-$version-macos-$arch.app.tar.gz.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate all platform assets and build updater metadata
        run: |
          python3 scripts/release_contract.py assemble \
            --assets-dir release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}"

      - name: Create or recover immutable release tag
        id: tag
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $existingCommit = git rev-list -n 1 $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($existingCommit)) {
            if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_RELEASE_COMMIT) -and $existingCommit.Trim() -ne $env:EXPECTED_RELEASE_COMMIT) {
              throw "Recovery tag $env:TAG points to $($existingCommit.Trim()), expected $env:EXPECTED_RELEASE_COMMIT"
            }
            $releaseCommit = $existingCommit.Trim()
            git checkout --detach $releaseCommit
          } else {
            git checkout --detach $env:SOURCE_SHA
            ./scripts/bump-version.ps1 -NewVersion $env:VERSION
            python3 scripts/release_contract.py validate-version --repo-root . --version $env:VERSION
            git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/lib/tauri.ts
            git commit -m "chore(release): prepare $env:TAG"
            $releaseCommit = (git rev-parse HEAD).Trim()
            git tag -a $env:TAG -m "Continuum $env:TAG"
            git push origin "refs/tags/$env:TAG"
          }
          "release_commit=$releaseCommit" >> $env:GITHUB_OUTPUT

      - name: Upload every required asset to a draft release
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.release_commit }}
          name: Continuum ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            release-assets/continuum-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
            release-assets/continuum-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe.sig
            release-assets/continuum-${{ needs.prepare.outputs.version }}-windows-x64.zip
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-aarch64.dmg
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-aarch64.app.tar.gz
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-aarch64.app.tar.gz.sig
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-aarch64.tar.gz
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-x86_64.dmg
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-x86_64.app.tar.gz
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-x86_64.app.tar.gz.sig
            release-assets/continuum-${{ needs.prepare.outputs.version }}-macos-x86_64.tar.gz
            release-assets/latest.json
            release-assets/release-manifest.json
            release-assets/SHA256SUMS.txt
          body: |
            ## Continuum ${{ needs.prepare.outputs.tag }}

            Automatically published from fully validated commit `${{ needs.prepare.outputs.source_sha }}`.

            ### Desktop downloads
            - **Windows x64:** NSIS setup executable
            - **macOS Apple Silicon:** `continuum-${{ needs.prepare.outputs.version }}-macos-aarch64.dmg`
            - **macOS Intel:** `continuum-${{ needs.prepare.outputs.version }}-macos-x86_64.dmg`

            All desktop packages include the Continuum runtime, context MCP server,
            and the policy-gated `continuum-agent-os` execution server.

            The updater archives are independently signed; `latest.json` carries their signatures.
            `release-manifest.json` and `SHA256SUMS.txt` describe the complete cross-platform asset set.

            ### Opening on macOS

            The macOS DMG is **not** Apple Developer ID-signed or notarized yet.
            When you download it from a browser, macOS adds a quarantine flag and
            may show **"Continuum" is damaged and can't be opened.** The app is
            not corrupt — Gatekeeper is refusing an unnotarized download. To open
            it, pick one:

            - Drag Continuum into `/Applications`, then **right-click** it and
              choose **Open** → confirm the prompt (one-time per version), or
            - Run `xattr -cr /Applications/Continuum.app` in a terminal, then
              double-click to open.

            See `KNOWN_ISSUES.md` for the full notes.

      - name: Verify the draft release has every asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" > "$RUNNER_TEMP/draft-release.json"
          python3 scripts/release_contract.py verify-published \
            --release-json "$RUNNER_TEMP/draft-release.json" \
            --version "$VERSION" \
            --allow-draft

      - name: Publish the fully assembled draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > "$RUNNER_TEMP/published-release.json"

      - name: Verify the published release has every asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 scripts/release_contract.py verify-published \
            --release-json "$RUNNER_TEMP/release.json" \
            --version "$VERSION"

      - name: Publication summary
        run: |
          {
            echo "## Published Continuum ${{ needs.prepare.outputs.tag }}"
            echo
            echo "- Release: ${{ steps.release.outputs.url }}"
            echo "- Source commit: \`${{ needs.prepare.outputs.source_sha }}\`"
            echo "- Release commit: \`${{ steps.tag.outputs.release_commit }}\`"
            echo "- Windows x64, macOS Apple Silicon and macOS Intel assets verified."
            echo "- Runtime, context MCP and Agent OS binaries bundled on every platform."
          } >> "$GITHUB_STEP_SUMMARY"
