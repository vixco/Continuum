name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_release: ${{ steps.current.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Skip superseded CI cleanly
        id: current
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$RELEASE_SHA" != "$main_sha" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "CI commit $RELEASE_SHA was superseded by $main_sha; nothing to publish."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Calculate next release version
        id: version
        if: steps.current.outputs.should_release == 'true'
        run: |
          current="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$current" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z][A-Za-z0-9-]*)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          elif [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "Unsupported SemVer in Cargo.toml: $current" >&2
            exit 1
          fi
          while git rev-parse "v$next" >/dev/null 2>&1; do
            if [[ "$next" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z][A-Za-z0-9-]*)\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "Release tag v$next already exists; bump the source version manually." >&2
              exit 1
            fi
          done
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify NSIS packaging contract
        shell: pwsh
        run: |
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if (@($config.bundle.targets) -notcontains "nsis") {
            throw "Tauri bundle targets must include nsis for Windows releases."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install protoc
        shell: pwsh
        run: choco install protoc --no-progress --confirm

      - name: Configure LLVM and Ninja
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) { choco install llvm --no-progress --confirm }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> $env:GITHUB_ENV
          choco install ninja --no-progress --confirm --skip-if-not-installed

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure updater signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured. Signed updater releases cannot be published safely."
          }

      - name: Bump version in release checkout
        shell: pwsh
        run: .\scripts\bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and MCP binaries
        run: cargo build --release --locked --bin continuum --bin continuum-mcp

      - name: Stage runtime resources for the desktop bundle
        shell: pwsh
        run: |
          $binDir = "apps/desktop/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "target/release/continuum.exe" "$binDir/continuum.exe" -Force
          Copy-Item "target/release/continuum-mcp.exe" "$binDir/continuum-mcp.exe" -Force

      - name: Build signed Tauri desktop app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Assemble Windows release assets
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $stage = "staging/continuum-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/continuum.exe" "$stage/"
          Copy-Item "target/release/continuum-mcp.exe" "$stage/"
          Copy-Item "config" "$stage/config" -Recurse
          Copy-Item "prompts" "$stage/prompts" -Recurse
          Copy-Item "skills" "$stage/skills" -Recurse
          Copy-Item "README.md","LICENSE","KNOWN_ISSUES.md" "$stage/"
          Copy-Item "scripts/install.ps1" "$stage/install.ps1"
          Compress-Archive -Path "$stage/*" -DestinationPath "$assets/continuum-$version-windows-x64.zip" -Force
          $bundleRoot = "target/release/bundle/nsis"
          $nsis = @(Get-ChildItem $bundleRoot -File -Filter "*-setup.exe" | Where-Object Name -Match "_$([Regex]::Escape($version))(?:_|-)")
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer for $version; found $($nsis.Name -join ', ')" }
          $sig = Get-Item "$($nsis[0].FullName).sig" -ErrorAction Stop
          Copy-Item $nsis[0].FullName "$assets/continuum-$version-windows-x64-setup.exe"
          Copy-Item $sig.FullName "$assets/continuum-$version-windows-x64-setup.exe.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  build-macos:
    name: Build macOS release (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            expected_uname: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            expected_uname: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_uname }}"

      - name: Verify DMG packaging contract
        run: |
          jq -e '.bundle.targets | index("dmg")' apps/desktop/src-tauri/tauri.conf.json >/dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Install native build prerequisites
        run: brew install ninja protobuf llvm

      - name: Configure LLVM for bindgen
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure updater signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured. Signed updater releases cannot be published safely." >&2
            exit 1
          }

      - name: Bump version in release checkout
        shell: pwsh
        run: ./scripts/bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"

      - name: Build runtime and MCP binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin continuum --bin continuum-mcp

      - name: Stage runtime resources for the desktop bundle
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
          cp "target/${{ matrix.target }}/release/continuum" apps/desktop/src-tauri/resources/bin/continuum
          cp "target/${{ matrix.target }}/release/continuum-mcp" apps/desktop/src-tauri/resources/bin/continuum-mcp
          chmod +x apps/desktop/src-tauri/resources/bin/continuum apps/desktop/src-tauri/resources/bin/continuum-mcp

      - name: Build signed Tauri desktop app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles dmg --target ${{ matrix.target }}

      - name: Assemble macOS release assets
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          arch="${{ matrix.arch }}"
          mkdir -p release-assets "staging/continuum-$version-macos-$arch"
          stage="staging/continuum-$version-macos-$arch"
          cp "target/$target/release/continuum" "$stage/"
          cp "target/$target/release/continuum-mcp" "$stage/"
          cp -R config "$stage/config"
          cp -R prompts "$stage/prompts"
          cp -R skills "$stage/skills"
          cp README.md LICENSE KNOWN_ISSUES.md "$stage/"
          tar -C staging -czf "release-assets/continuum-$version-macos-$arch.tar.gz" "continuum-$version-macos-$arch"
          dmg=(target/$target/release/bundle/dmg/*.dmg)
          updater=(target/$target/release/bundle/macos/*.app.tar.gz)
          if [ "${#dmg[@]}" -ne 1 ] || [ "${#updater[@]}" -ne 1 ] || [ ! -f "${updater[0]}.sig" ]; then
            echo "Expected exactly one DMG and updater archive with signature for $target" >&2
            find "target/$target/release/bundle" -type f -print >&2
            exit 1
          fi
          cp "${dmg[0]}" "release-assets/continuum-$version-macos-$arch.dmg"
          cp "${updater[0]}" "release-assets/continuum-$version-macos-$arch.app.tar.gz"
          cp "${updater[0]}.sig" "release-assets/continuum-$version-macos-$arch.app.tar.gz.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish cross-platform release
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: continuum-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble updater metadata and checksums
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          repo="${{ github.repository }}"
          cd release-assets
          win_sig="$(tr -d '\r\n' < "continuum-$version-windows-x64-setup.exe.sig")"
          arm_sig="$(tr -d '\r\n' < "continuum-$version-macos-aarch64.app.tar.gz.sig")"
          intel_sig="$(tr -d '\r\n' < "continuum-$version-macos-x86_64.app.tar.gz.sig")"
          jq -n \
            --arg version "$version" \
            --arg notes "Automatic Continuum release $tag. See the GitHub release notes for details." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$repo" \
            --arg tag "$tag" \
            --arg win_sig "$win_sig" \
            --arg arm_sig "$arm_sig" \
            --arg intel_sig "$intel_sig" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $win_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-windows-x64-setup.exe")}, "darwin-aarch64": {signature: $arm_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-macos-aarch64.app.tar.gz")}, "darwin-x86_64": {signature: $intel_sig, url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/continuum-" + $version + "-macos-x86_64.app.tar.gz")}}}' > latest.json
          sha256sum * > SHA256SUMS.txt
          cp latest.json ../latest.json

      - name: Commit version and updater metadata to main
        shell: pwsh
        run: |
          ./scripts/bump-version.ps1 -NewVersion "${{ needs.prepare.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/lib/tauri.ts latest.json
          git commit -m "chore(release): prepare ${{ needs.prepare.outputs.tag }} [skip ci]"
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "Continuum ${{ needs.prepare.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Continuum ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            ## Continuum ${{ needs.prepare.outputs.tag }}

            This release was published automatically after a successful push to `main`.
            Signed updater artifacts are available for Windows, Apple Silicon Macs, and Intel Macs.

            **Windows install:**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.prepare.outputs.tag }}/scripts/install.ps1 | iex
            ```

            On macOS, open the DMG matching your processor architecture. The
            `latest.json` updater metadata is signed independently of the app bundle.
