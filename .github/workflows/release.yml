name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for `git describe` in the release notes

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        # .cargo/config.toml sets sccache as the rustc-wrapper + cmake launcher.
        # Without this step the GitHub runner has no sccache and every cargo
        # invocation fails with "program not found".
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (last-chance verification)
        run: cargo test --workspace -- --skip matches_whisper_k_to_c_homophone

      - name: Build kairo.exe (release)
        run: cargo build --release --bin kairo

      - name: Build kairo-mcp.exe (release)
        run: cargo build --release --bin kairo-mcp

      - name: Install frontend deps (pnpm workspace root)
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri desktop app (release, bundles MSI)
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Assemble portable bundle
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "staging\kairo-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\kairo.exe" "$stage\"
          Copy-Item "target\release\kairo-mcp.exe" "$stage\"
          $desktop = Get-ChildItem "apps\desktop\src-tauri\target\release" -Filter "kairo-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($desktop) { Copy-Item $desktop.FullName "$stage\" }
          Copy-Item "config" "$stage\config" -Recurse
          Copy-Item "prompts" "$stage\prompts" -Recurse
          Copy-Item "skills" "$stage\skills" -Recurse
          Copy-Item "README.md" "$stage\"
          Copy-Item "LICENSE" "$stage\"
          Copy-Item "KNOWN_ISSUES.md" "$stage\"
          Copy-Item "scripts\install.ps1" "$stage\install.ps1"
          Compress-Archive -Path "$stage\*" -DestinationPath "kairo-$version-windows-x64.zip" -Force
          echo "Portable bundle: kairo-$version-windows-x64.zip"

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps\desktop\src-tauri\target\release\bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            Write-Warning "No MSI produced; Tauri bundle may have failed."
            echo "msi_path=" >> $env:GITHUB_OUTPUT
          } else {
            echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Sign binaries (optional)
        # Runs only if the signing secrets are configured. Otherwise skipped.
        if: env.KAIRO_SIGN_THUMBPRINT != ''
        env:
          KAIRO_SIGN_THUMBPRINT: ${{ secrets.KAIRO_SIGN_THUMBPRINT }}
        shell: pwsh
        run: |
          .\scripts\sign-release.ps1 -ArtifactDir "target\release" -Thumbprint $env:KAIRO_SIGN_THUMBPRINT

      - name: Generate SHA256 checksums
        id: checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "kairo-$version-windows-x64.zip"
          $lines = @()
          if (Test-Path $zip) {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $zip"
          }
          if ("${{ steps.msi.outputs.msi_path }}") {
            $msi = "${{ steps.msi.outputs.msi_path }}"
            if (Test-Path $msi) {
              $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
              $lines += "$hash  $(Split-Path -Leaf $msi)"
            }
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kairo-${{ steps.version.outputs.version }}-windows-x64
          path: |
            kairo-${{ steps.version.outputs.version }}-windows-x64.zip
            ${{ steps.msi.outputs.msi_path }}
            SHA256SUMS.txt

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kairo ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-alpha') || contains(steps.version.outputs.tag, '-beta') }}
          generate_release_notes: true
          files: |
            kairo-${{ steps.version.outputs.version }}-windows-x64.zip
            ${{ steps.msi.outputs.msi_path }}
            SHA256SUMS.txt
          body: |
            ## Kairo ${{ steps.version.outputs.tag }}

            See [CHANGELOG.md](https://github.com/PrincNL/kairo-ai/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for the full list of changes.

            Known issues: [KNOWN_ISSUES.md](https://github.com/PrincNL/kairo-ai/blob/${{ steps.version.outputs.tag }}/KNOWN_ISSUES.md).

            **Install from this release:**
            ```powershell
            irm https://raw.githubusercontent.com/PrincNL/kairo-ai/${{ steps.version.outputs.tag }}/scripts/install.ps1 | iex
            ```

            This release is **unsigned** — Windows SmartScreen will warn on first launch.
