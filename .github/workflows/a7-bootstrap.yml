name: A7 public source export

on:
  push:
    branches: [swarm/a7-performance-privacy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-public-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Archive tracked public source
        run: git archive --format=zip --output="$RUNNER_TEMP/continuum-a7-source.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: continuum-a7-public-source
          path: ${{ runner.temp }}/continuum-a7-source.zip
          if-no-files-found: error
          retention-days: 1
