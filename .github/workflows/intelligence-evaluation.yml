name: Persistent intelligence evaluation

on:
  push:
    branches:
      - main
      - "swarm/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-contract:
    name: Cross-layer intelligence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run evaluator regression tests
        run: python -m unittest -v scripts/test_persistent_intelligence_eval.py

      - name: Run chat streaming and scroll regression
        run: >-
          node --experimental-strip-types --test
          apps/desktop/tests/chat-scroll-behavior.test.mjs

      - name: Evaluate committed synthetic suite
        run: >-
          python scripts/persistent_intelligence_eval.py
          --suite evals/persistent-intelligence/reference-suite.json
          --report persistent-intelligence-report.json

      - name: Verify runtime proof remains unavailable
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python scripts/persistent_intelligence_eval.py \
            --suite evals/persistent-intelligence/reference-suite.json \
            --require-runtime \
            --report persistent-intelligence-runtime-gate-report.json \
            > persistent-intelligence-runtime-gate.stdout.json
          status=$?
          set -e

          if [[ "$status" -ne 1 ]]; then
            echo "::error::Expected the reserved runtime gate to exit 1; got $status"
            cat persistent-intelligence-runtime-gate.stdout.json >&2 || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("persistent-intelligence-runtime-gate-report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["contract_status"] == "pass", report
          assert report["runtime_status"] == "unsupported", report
          assert report["runtime_required"] is True, report
          assert report["runtime_evidence_supported"] is False, report
          PY

      - name: Upload sanitized evaluation reports
        if: ${{ always() && hashFiles('persistent-intelligence-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: persistent-intelligence-evaluation-${{ github.run_id }}
          path: |
            persistent-intelligence-report.json
            persistent-intelligence-runtime-gate-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized evaluation summary
        if: always()
        shell: bash
        run: |
          if [[ -f persistent-intelligence-report.json ]]; then
            {
              echo '## Persistent-intelligence contract'
              echo
              echo 'The committed suite is synthetic contract evidence, not runtime proof.'
              echo
              echo '```json'
              cat persistent-intelligence-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f persistent-intelligence-runtime-gate-report.json ]]; then
            {
              echo
              echo '## Reserved runtime gate'
              echo
              echo 'Expected result: unsupported and non-zero until artifact-bound runtime adapters exist.'
              echo
              echo '```json'
              cat persistent-intelligence-runtime-gate-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
