fn render_untrusted_label(value: &str) -> String {
    let without_controls = value
        .chars()
        .map(|ch| if ch.is_control() { ' ' } else { ch })
        .collect::<String>();
    let collapsed = without_controls
        .split_whitespace()
        .collect::<Vec<_>>()
        .join(" ");
    let bounded = collapsed.chars().take(80).collect::<String>();
    if bounded.is_empty() {
        "\"[unavailable]\"".to_string()
    } else {
        format!("{bounded:?}")
    }
}

