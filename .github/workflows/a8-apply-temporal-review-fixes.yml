name: A8 apply temporal review fixes

on:
  push:
    branches:
      - "swarm/a8-evaluation-and-ci"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "Continuum Agent"
          git config user.email "93612321+vixco@users.noreply.github.com"

      - name: Apply reviewed temporal trust-boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python .a8-temporal-fix.py

      - name: Format reviewed Rust files
        shell: bash
        run: |
          set -uo pipefail
          set +e
          rustfmt --edition 2021 \
            crates/continuum-core/src/context/temporal.rs \
            apps/desktop/src-tauri/src/chat/temporal_history.rs \
            2>&1 | tee /tmp/a8-rustfmt.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -ne 0 ]]; then
            cp /tmp/a8-rustfmt.log .a8-rustfmt.log
            git add .a8-rustfmt.log
            git commit -m "chore(a8): capture focused rustfmt diagnostic"
            git push origin HEAD:swarm/a8-evaluation-and-ci
            exit "$status"
          fi

      - name: Run focused temporal tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo test -p continuum-core --no-default-features context::temporal \
            2>&1 | tee /tmp/a8-temporal-test.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -ne 0 ]]; then
            cp /tmp/a8-temporal-test.log .a8-temporal-test.log
            git add .a8-temporal-test.log
            git commit -m "chore(a8): capture focused temporal-test diagnostic"
            git push origin HEAD:swarm/a8-evaluation-and-ci
            exit "$status"
          fi

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            crates/continuum-core/src/context/temporal.rs \
            apps/desktop/src-tauri/src/chat/temporal_history.rs
          git diff --cached --check
          git commit -m "fix(temporal): require supporting provenance and quote untrusted labels"
          git push origin HEAD:swarm/a8-evaluation-and-ci
