name: A2 runtime integration retry

on:
  push:
    branches: [swarm/a2-ambient-perception]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[a2-runtime-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply anchored patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/a2-runtime-integration.yml').read_text()
          start = workflow.index('          from pathlib import Path')
          end = workflow.index('      - name: Format Rust')
          code = textwrap.dedent(workflow[start:end])
          bad = "replace_one(path, '''    #[test]\\n    fn''',"
          cut = code.index(bad)
          namespace = {}
          exec(code[:cut], namespace)
          replace_one = namespace['replace_one']

          replace_one(
              'crates/continuum-core/src/triage/consume.rs',
              '''    // -- mapping table (spec §4.7) --\n\n    #[test]\n    fn mapping_table_is_exhaustive_over_the_registry() {''',
              '''    // -- mapping table (spec §4.7) --\n\n    #[test]\n    fn perception_event_sensitivity_bridge_is_total() {\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::CloudAllowed),\n            Some(EventSensitivity::CloudAllowed)\n        );\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::LocalOnly),\n            Some(EventSensitivity::LocalOnly)\n        );\n        assert_eq!(\n            event_sensitivity_from_perception(PerceptionSensitivity::NeverObserve),\n            None\n        );\n    }\n\n    #[test]\n    fn mapping_table_is_exhaustive_over_the_registry() {''',
          )

          Path('docs/changelog/2026-08-10-a2-ambient-perception.md').write_text('''# A2 — efficient ambient perception and vision context\n\n- Added privacy-gated SHA-256 frame identity plus brightness-sensitive perceptual change detection; `never_observe` returns before hashing or semantic selection.\n- Added a bounded per-display/per-region second-stage gate behind the existing 64×36 luma prefilter, with deterministic LRU eviction and time-based fallback refresh.\n- Wired the gate into the real `xcap` watcher without creating a second capture loop; selected compact observation provenance and real perception metrics/health now ride the existing `world_compact` channel and therefore persist with raw-frame/context-event provenance without storing pixels.\n- Added stable occurrence ids distinct from content identity, capture timestamps, display keys, strong content digest, change score, semantic-processing flag, confidence, source, sensitivity and retention metadata.\n- Added explicit observation→event sensitivity conversion: `cloud_allowed` and `local_only` map exhaustively; `never_observe` has no event representation.\n- Added explicit health states for observing, disabled, paused, stale, permission-required, encoder-unavailable, unavailable, degraded, processing, error and historical-capture-disabled conditions.\n- Added strict retention helpers: `Ephemeral` and `DoNotPersist` are non-persistable; `local_only` is not an automatic durable-memory candidate; `never_observe` is neither semantically cacheable nor persistable.\n- Added runtime counters for capture/change/inference/emission latency, redundant selected packets, inference frequency, buffer drops and gate-state evictions. CPU/GPU/memory remain owned by the runtime-health subsystem.\n- Added synthetic tests for privacy-before-processing spies, duplicate/fallback behavior, uniform full-screen brightness changes, frame-shape identity, multi-monitor isolation, bounded state, cache-key sensitivity/revision identity, all privacy×retention combinations, occurrence provenance, event sensitivity mapping and health states.\n- Added a reproducible synthetic `perception_gate_bench` example. Its output measures only fingerprint/change-gate overhead and makes no Windows/native capture or ONNX performance claim.\n\nA7 coordination: A2 exports only inner, text-free encoder/content identity. It is not a safe cross-scope cache by itself; privacy generation, profile/project scope, TTL/byte bounds and invalidation remain the shared cache owner's responsibility.\n\nIntegration note: fold this entry into the root `CHANGELOG.md` once when the swarm branches are integrated.\n''')
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "continuum-swarm-a2"
          git config user.email "actions@users.noreply.github.com"
          git add crates/continuum-vision crates/continuum-core/src/senses/vision.rs crates/continuum-core/src/triage/consume.rs docs/changelog/2026-08-10-a2-ambient-perception.md
          git diff --cached --check
          git commit -m "feat(vision): wire privacy-gated ambient evidence [a2-runtime-patched]"
          git push origin HEAD:swarm/a2-ambient-perception
