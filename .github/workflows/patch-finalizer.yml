name: Patch finalizer workflow

on:
  push:
    branches:
      - swarm/review-finalize-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: swarm/review-finalize-20260810
      - name: Preserve all formatter output in integration commits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-reviewed-swarm.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          index = 0
          replaced_multiline = 0
          replaced_chat = 0

          while index < len(lines):
              line = lines[index]
              stripped = line.strip()
              if stripped == 'git add \\':
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(f'{indent}git add -A')
                  index += 1
                  while index < len(lines) and not lines[index].strip().startswith('git commit --amend'):
                      index += 1
                  if index >= len(lines):
                      raise SystemExit('unterminated multiline git add block')
                  output.append(lines[index])
                  replaced_multiline += 1
                  index += 1
                  continue
              if stripped == 'git add apps/desktop/tests/chat-scroll-behavior.test.mjs':
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(f'{indent}git add -A')
                  replaced_chat += 1
                  index += 1
                  continue
              output.append(line)
              index += 1

          if replaced_multiline not in (0, 1):
              raise SystemExit(f'unexpected multiline staging blocks: {replaced_multiline}')
          if replaced_chat not in (0, 1):
              raise SystemExit(f'unexpected chat staging blocks: {replaced_chat}')
          rendered = '\n'.join(output) + '\n'
          if 'git add -A' not in rendered:
              raise SystemExit('finalizer staging was not updated')
          path.write_text(rendered, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'Finalizer already patched.'
            exit 0
          fi
          git config user.name 'Continuum integration bot'
          git config user.email '93612321+vixco@users.noreply.github.com'
          git add .github/workflows/finalize-reviewed-swarm.yml
          git commit -m 'fix(ci): commit formatter output before cherry-picks'
          git push origin HEAD:swarm/review-finalize-20260810
