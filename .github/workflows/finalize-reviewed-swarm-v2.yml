name: Finalize reviewed swarm integration v2

on:
  push:
    branches:
      - swarm/review-finalize-20260810

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: swarm/agi-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - name: Fetch reviewed finalizer
        shell: bash
        run: |
          set -euo pipefail
          git show origin/swarm/review-finalize-20260810:scripts/finalize_swarm_integration.sh > /tmp/finalize_swarm_integration.sh
          chmod +x /tmp/finalize_swarm_integration.sh
      - name: Integrate, validate and push
        shell: bash
        run: /tmp/finalize_swarm_integration.sh
