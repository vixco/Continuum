name: Feature request
description: Propose a new feature or capability for Kairo.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Before filing, please make sure this fits Kairo's scope:
        Kairo is a desktop-native, local-first ambient AI for Windows, using Claude Code via its official CLI.
        Features that push toward "more ambient, more local, more self-reliant" are a great fit. Features that
        require cloud services, paid APIs, or violate the [non-negotiables in CLAUDE.md](../../CLAUDE.md#non-negotiables)
        almost certainly aren't.

  - type: textarea
    id: use-case
    attributes:
      label: What problem does this solve?
      description: Describe the concrete situation where you'd use this feature.
      placeholder: "When I'm in a meeting, Kairo keeps whispering transcript notes — I'd like to mute it automatically."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What should Kairo do? How should it behave? Be specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you think about? Why is the proposed solution better?

  - type: dropdown
    id: layer
    attributes:
      label: Which layer does this touch?
      options:
        - Layer 1 — Senses (perception)
        - Layer 2 — Triage
        - Layer 3 — Orchestrator
        - Layer 4 — Workers
        - MCP tools
        - Dashboard
        - Voice
        - Memory
        - Self-healing
        - Skills
        - Installer / onboarding
        - Docs
        - Cross-cutting / not sure
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Does this fit Kairo's principles?
      description: Check only the boxes that apply. Features that violate any of these need a very good reason.
      options:
        - label: This keeps Kairo local-first (no new cloud dependency).
        - label: This keeps Kairo legal (no token scraping, no reverse engineering).
        - label: This keeps the four-layer architecture intact.
        - label: This includes self-healing hooks (health check, recovery procedure, structured logs).
        - label: I'm willing to help implement this.
