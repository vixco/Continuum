[package]
name = "continuum-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Continuum desktop app — Tauri 2 backend"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["audio-devices"]
audio-devices = ["dep:cpal"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
continuum-core = { path = "../../../crates/continuum-core", default-features = false }
continuum-gateway = { path = "../../../crates/continuum-gateway" }
continuum-memory = { path = "../../../crates/continuum-memory" }
cpal = { version = "0.17", optional = true }
dirs = "6"
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
parking_lot = "0.12"
sysinfo = { version = "0.33", default-features = false, features = ["system", "multithread"] }
tempfile = "3"
tokio-util = "0.7"
url = "2"
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
