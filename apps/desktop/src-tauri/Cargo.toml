[package]
name = "continuum-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Continuum desktop app — Tauri 2 backend"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
continuum-core = { path = "../../../crates/continuum-core", default-features = false }
parking_lot = "0.12"
sysinfo = { version = "0.33", default-features = false, features = ["system", "multithread"] }
tempfile = "3"
url = "2"
