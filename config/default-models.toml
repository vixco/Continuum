# Kairo default model configuration
# Override in ~/.kairo/config.toml under [models]

[vision]
name = "SmolVLM-256M"
variant = "smolvlm-256m"
path = "~/.kairo-dev/models/vision/smolvlm-256m"
size_mb = 500
runtime = "onnx"
gpu_enabled = false  # Phase 1: CPU only. Set true for CUDA acceleration.
# Alternatives: moondream-2b (recommended for GPU users), florence-2-base, florence-2-large, minicpm-v-2.6

[triage]
name = "Qwen 3 8B"
variant = "qwen3-8b-q4_k_m"
path = "~/.kairo-dev/models/triage/qwen3-8b-q4_k_m.gguf"
size_mb = 4800
runtime = "llama-cpp"
gpu_layers = -1  # -1 or 999 = offload all layers to GPU (recommended). 0 = CPU only.
# Thinking mode must be disabled for triage — the system prompt includes /no_think.
# Low-VRAM fallback: qwen3-4b-q4_k_m (~2.5 GB, weaker Dutch + decision boundaries)
# path = "~/.kairo-dev/models/triage/qwen3-4b-q4_k_m.gguf"

[orchestrator]
name = "Claude Opus 4.6"
model_id = "claude-opus-4-6"
runtime = "claude-cli"
# No local model — uses claude CLI subprocess

[workers]
mode = "auto"  # "auto" | "budget" (sonnet) | "power" (opus)
budget_model = "claude-sonnet-4-6"
power_model = "claude-opus-4-6"
max_concurrent = 3

[audio]
# Chosen audio input device. Kairo runs an interactive picker on first start
# (or when you pass `--reset-audio`, or when the hardware has changed) and
# saves the result here. Pick by running `kairo` once, or by running
# `cargo run --release --bin audio-probe` to re-pick without booting the full
# runtime.
#
# These fields are written by the picker at runtime to
# ~/.kairo-dev/config.toml. Leave them empty here — this file is a template.
# device_name  = "Microphone"     # display name from cpal description()
# device_index = 2                # cpal enumeration index at pick time

# Whisper input language. Default "en" because whisper-small's
# auto-detect is unreliable on short (< 2 s) wake-word clips — we've
# seen "hey kairo" mis-detected as Portuguese "Ei, Cairo!" at p=0.55.
# Forcing English keeps wake detection stable.
#
# Change to "nl", "de", or another code if you primarily speak a
# different language. Change to "auto" if your clips are long enough
# (>2 s) for confident language detection. Kairo's output language is
# controlled separately under [tts] — input and output are decoupled,
# so "en" input still lets Kairo respond in English (current default).
whisper_language = "en"

# Adaptive VAD: the runtime threshold is
#   max(vad_threshold, noise_floor × vad_noise_floor_multiplier)
# where noise_floor is the mean RMS of the last ~10 s of silence chunks.
# Defaults self-calibrate across quiet laptop mics and hot USB mics without
# manual tuning.

# Absolute minimum RMS below which no chunk is ever considered speech.
# Keeps a dead-silent room from mis-triggering on microscopic noise.
vad_threshold = 0.005

# How many times the rolling noise floor is multiplied for the speech
# threshold. Higher = less sensitive (needs louder speech). Lower = more
# sensitive (may trigger on fans / keyboard clicks).
vad_noise_floor_multiplier = 5.0

# Trailing silence (ms) before a speech segment is closed and sent to whisper.
# 800 ms keeps natural mid-sentence pauses inside the same segment.
silence_duration_ms = 800

# Force-split a single segment if it exceeds this many seconds (prevents
# whisper inference on multi-minute monologues).
max_segment_secs = 8

[memory]
# Phase 3 completion: raw perception frames that look worth remembering are
# distilled into LanceDB episodic memory in the background.
distillation_enabled = true
distillation_interval_minutes = 15
distillation_lookback_minutes = 20
distillation_min_salience = 0.35
distillation_batch_size = 100

[stt]
name = "Whisper small"
variant = "whisper-small"
path = "~/.kairo/models/stt/whisper-small.bin"
size_mb = 244
runtime = "whisper-cpp"
# Alternatives: whisper-tiny, whisper-base, whisper-medium, whisper-large-v3

[tts]
# Phase 5 TTS is fully local (Piper). Every model file must exist before
# `cargo run --bin kairo` attempts to speak - otherwise whisper decisions
# and orchestrator responses will fall through to log-only mode.
#
# Run `powershell scripts/download-models.ps1` to populate ~/.kairo-dev/models/tts/
# AND to install piper.exe + espeak-ng-data under ~/.kairo-dev/bin/piper/.
#
# OUTPUT STRATEGY: Kairo speaks English by default because the Dutch Piper
# voices available as of 2026-04 (nl_NL-mls-medium) produce barely-
# intelligible speech. Input is still multilingual - whisper.cpp
# transcribes any language the user speaks and Kairo understands it;
# Kairo just always responds in English.
#
# To re-enable multilingual output later (e.g. once a better Dutch voice
# ships):
#   1. Set [voice].language_detection_enabled = true
#   2. Uncomment the [tts.voices.nl] section below (and/or add more)
#   3. Drop the "always respond in English" rule from
#      prompts/orchestrator-system.md

enabled = true

# Engine backend: "piper" (local, default) or "elevenlabs" (cloud plugin,
# requires an API key below). Phase 5 ships Piper only; ElevenLabs is a
# config-stable extension point for a later plugin release.
engine = "piper"

# espeak-ng dictionary directory (exported as PIPER_ESPEAKNG_DATA_DIRECTORY
# at startup). Installed by scripts/download-models.ps1 from the Piper
# Windows release bundle.
espeak_data_dir = "~/.kairo-dev/models/tts/espeak-ng-data"

# BCP-47 short code of the voice used when no language hint is available.
# When language_detection_enabled = false (default), this is the ONLY
# voice Kairo ever uses, regardless of the transcribed input language.
primary = "en"

# length_scale = 1.0 is Piper's default. <1.0 speeds up speech, >1.0 slows
# it down. `None` (omit) uses the value baked into the voice config.
# length_scale = 1.0

[tts.voices.en]
model_path  = "~/.kairo-dev/models/tts/en_US-lessac-medium.onnx"
config_path = "~/.kairo-dev/models/tts/en_US-lessac-medium.onnx.json"
# en_US-lessac-medium is single-speaker - leave unset.
# speaker_id = 0

# Dutch voice disabled by default - nl_NL-mls-medium produces low-
# intelligibility speech. The download script still installs the files
# so you can opt in by uncommenting this section and setting
# [voice].language_detection_enabled = true.
# [tts.voices.nl]
# model_path  = "~/.kairo-dev/models/tts/nl_NL-mls-medium.onnx"
# config_path = "~/.kairo-dev/models/tts/nl_NL-mls-medium.onnx.json"
# speaker_id  = 0

# Optional ElevenLabs streaming cloud backend. Disabled by default. To
# activate, set engine = "elevenlabs" above and provide credentials here.
[tts.elevenlabs]
api_key          = ""
voice_id         = ""
model_id         = "eleven_turbo_v2_5"
stability        = 0.5
similarity_boost = 0.75

[voice]
enabled = true
wake_word_enabled = true
wake_keyword = "hey kairo"
wake_sensitivity = 0.5
# Optional native wake-word .ppn path. Empty uses local transcript detection
# over Whisper output, so Kairo still has a fully local wake gate without an
# access-key dependency in core.
custom_keyword_path = ""
listen_timeout_ms = 12000
endpoint_silence_ms = 700
min_utterance_chars = 3
barge_in_enabled = true
ambient_mute_enabled = true

# Route TTS to a per-language voice based on whisper's detected language.
# Disabled by default: Kairo understands any language the user speaks
# (whisper_language = "auto" above) but always responds in English via
# the [tts].primary voice. Enable only if you have a quality voice file
# for every language you want Kairo to speak.
language_detection_enabled = false

default_language = "en"

# Master playback gain [0.0, 1.0]. Applied in the cpal callback; takes
# effect on the next audio buffer.
volume = 0.8

# Play short audio cues (chime on wake, click on listen start, double-beep
# on error). Set to false for fully silent state transitions.
feedback_sounds = true

# Global hotkey for toggle-listen. Empty string disables it. Modifier
# chord: "Ctrl", "Shift", "Alt", "Win" joined with "+".
hotkey = "Ctrl+Shift+K"

# After Kairo finishes speaking, keep the voice session alive this many
# seconds for a natural follow-up without re-triggering the wake word.
# Set to 0 to require wake word on every interaction.
conversation_followup_seconds = 5

# Phase 4: MCP server configuration (filesystem allowlist extension)
# Default allowed roots: ~/.kairo-dev/ and every semantic fact matching key
# "project.*.dir". The deny list is hardcoded and cannot be disabled. Add extra
# read-only directories here to expand what Opus can inspect via fs_read_file /
# fs_list_dir. Paths support ~ expansion.
[mcp.fs]
extra_paths = []
