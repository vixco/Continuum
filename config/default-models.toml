# Continuum default model configuration
# Override in ~/.continuum/config.toml under [models]

[vision]
name = "SmolVLM2-2.2B Q4_K_M"
variant = "smolvlm2-2.2b-q4"
path = "~/.continuum-dev/models/vision/smolvlm2-2.2b-q4"
fallback_path = "~/.continuum-dev/models/vision/smolvlm-500m"
size_mb = 1900
runtime = "llama-cpp-mtmd"
gpu_enabled = true   # CPU fallback is automatic in builds without CUDA/Vulkan.
# Safe fallback: SmolVLM-500M ONNX. Low-resource fallback: SmolVLM-256M ONNX.

[triage]
name = "Qwen 3 8B"
variant = "qwen3-8b-q4_k_m"
path = "~/.continuum-dev/models/triage/qwen3-8b-q4_k_m.gguf"
size_mb = 4800
runtime = "llama-cpp"
gpu_layers = -1  # -1 or 999 = offload all layers to GPU (recommended). 0 = CPU only.
# Thinking mode must be disabled for triage — the system prompt includes /no_think.
# Low-VRAM fallback: qwen3-4b-q4_k_m (~2.5 GB, weaker Dutch + decision boundaries)
# path = "~/.continuum-dev/models/triage/qwen3-4b-q4_k_m.gguf"

[orchestrator]
name = "Primary reasoning agent"
agent = "claude"
provider = ""
model_id = "claude-opus-4-6"
runtime = "agent-cli"
# No local model — uses claude CLI subprocess

[workers]
agent = "claude"
provider = ""
mode = "auto"  # "auto" | "budget" (sonnet) | "power" (opus)
budget_model = "claude-sonnet-4-6"
power_model = "claude-opus-4-6"
max_concurrent = 3

[audio]
# Chosen audio input device. Continuum runs an interactive picker on first start
# (or when you pass `--reset-audio`, or when the hardware has changed) and
# saves the result here. Pick by running `continuum` once, or by running
# `cargo run --release --bin audio-probe` to re-pick without booting the full
# runtime.
#
# These fields are written by the picker at runtime to
# ~/.continuum-dev/config.toml. Leave them empty here — this file is a template.
# device_name  = "Microphone"     # display name from cpal description()
# device_index = 2                # cpal enumeration index at pick time

# Whisper input language. Default "en" because whisper-small's
# auto-detect is unreliable on short (< 2 s) wake-word clips — we've
# seen "hey continuum" mis-detected as Portuguese "Ei, Cairo!" at p=0.55.
# Forcing English keeps wake detection stable.
#
# Change to "nl", "de", or another code if you primarily speak a
# different language. Change to "auto" if your clips are long enough
# (>2 s) for confident language detection. Continuum's output language is
# controlled separately under [tts] — input and output are decoupled,
# so "en" input still lets Continuum respond in English (current default).
whisper_language = "en"

# Adaptive VAD: the runtime threshold is
#   max(vad_threshold, noise_floor × vad_noise_floor_multiplier)
# where noise_floor is the mean RMS of the last ~10 s of silence chunks.
# Defaults self-calibrate across quiet laptop mics and hot USB mics without
# manual tuning.

# Absolute minimum RMS below which no chunk is ever considered speech.
# Keeps a dead-silent room from mis-triggering on microscopic noise.
vad_threshold = 0.005

# How many times the rolling noise floor is multiplied for the speech
# threshold. Higher = less sensitive (needs louder speech). Lower = more
# sensitive (may trigger on fans / keyboard clicks).
vad_noise_floor_multiplier = 5.0

# Trailing silence (ms) before a speech segment is closed and sent to whisper.
# 800 ms keeps natural mid-sentence pauses inside the same segment.
silence_duration_ms = 800

# Force-split a single segment if it exceeds this many seconds (prevents
# whisper inference on multi-minute monologues).
max_segment_secs = 8

# Context engine §4.11: raw-log retention and the screenshot policy. The
# distiller ticker runs rotation hourly (even when distillation is off —
# retention is a privacy promise). Rotation deletes the JPEG each expired
# frame row referenced, then sweeps `screenshots_dir` for images whose
# mtime is older than `screenshot_max_age_hours` — the backstop that
# reclaims files orphaned by a crash between "image saved" and "row
# written". The sweep never consults the database, so keep the backstop at
# or above `retention_days * 24`. Set `screenshot_max_age_hours = 0` to
# disable the age sweep, or `delete_screenshots_with_rotation = false` to
# stop Continuum deleting images at all.
[storage]
retention_days = 30
delete_screenshots_with_rotation = true
screenshot_max_age_hours = 720

[memory]
# Phase 3 completion: what looks worth remembering is distilled into LanceDB
# episodic memory in the background. Since the context engine's §4.11
# compression ladder the distiller reads DEDUPED context events first
# (fourteen identical build failures become one "build failed (×14)" memory,
# with a small importance boost per doubling of the count), and falls back to
# the raw-frame salience predicate for frames that produced no classified
# event.
#
# The two rungs have SEPARATE thresholds, because they measure different
# things: `distillation_min_salience` gates raw frames (perception salience),
# `distillation_min_event_importance` gates deduped events (classifier /
# collector importance). Deterministic collector events are emitted at
# importance 0.2 on purpose — individually they are bookkeeping, together
# they are "what happened today" — so the event threshold defaults BELOW
# that. Raise it toward 0.35 for a quieter episodic store; lower the frame
# threshold to distil more unclassified frames.
distillation_enabled = true
distillation_interval_minutes = 15
distillation_lookback_minutes = 20
distillation_min_salience = 0.35
distillation_min_event_importance = 0.15
distillation_batch_size = 100

# Context engine §4.7: per-type expiry for the vault memory candidates the
# triage classifier proposes. A candidate nobody confirms is archived by the
# vault's expiry sweep once its TTL passes. Omit a key (or set it to 0) to
# make that type never expire — the right default for decisions and
# preferences, which describe how the user works rather than transient state.
[memory.candidate_ttl_days]
task = 30
error = 30
# decision / preference: no TTL by default (omitted deliberately).
note = 90

# Context engine §4.8: session state — Continuum's live "what is the user
# doing" picture. Everything except goal/activity interpretation is mechanical
# and free; these knobs govern the ONE background LLM call it ever makes.
# Inference is skipped entirely while you are idle (§4.11) and always
# queues behind interactive triage (§4.7 LocalLlm discipline).
[session_state]
# Hard rate limit: minimum seconds between two inference attempts, whatever
# triggered them. A failed attempt starts the same cooldown as a successful
# one, so a broken model can never spin.
infer_min_interval_secs = 120
# Re-infer when the current goal/task are older than this, even if nothing
# else happened.
infer_max_age_minutes = 10
# Re-infer once this many *significant* events piled up since the last
# attempt.
infer_min_new_events = 8
# A short editor -> browser -> chat loop is already meaningful, even when
# individual focus events are below significant_importance.
infer_min_focus_switches = 2
# Importance an event must reach to count toward infer_min_new_events.
significant_importance = 0.5
# Below this confidence, all inferred claims are discarded and every
# consumer renders "unknown" — the honest answer when Continuum does not
# know. Also caps the confidence of a very stale rehydrated snapshot.
confidence_floor = 0.4
# max_tokens for one inference call (the background LLM tier clamps to 256
# regardless).
infer_max_tokens = 256

# --- Context package (spec §4.9/§6) ---
# One package, three consumer profiles: the wake message (runtime), the
# `context_package` MCP tool, and the desktop chat system prompt.
#
# Drop order when a package is over budget (documented + tested):
#   open files -> recent changes -> just-before tail -> memories tail
# NEVER dropped: why-woken, current moment, session state, pending memory
# decisions (the order contract: pending is the last section before the
# wake reason).
#
# Tokens are estimated at 3.5 bytes/token — the same proxy the triage
# prompt-fit gate uses, not a real tokenizer.
[context_package]
# Whole-package budget for the wake profile.
token_budget = 1000
# Whole-package budget for the desktop chat profile.
chat_token_budget = 600
# How far back the packager reads deduped context_events for its
# just-before / recent-changes / failed-attempts sections.
events_window_minutes = 20
# Per-section caps.
max_just_before = 5
max_memories = 3
max_facts = 8
max_vault_notes = 5
max_pending_decisions = 5
max_recent_changes = 5
max_failed_attempts = 3
max_open_files = 5
max_tools = 12
# Characters of the compact world-state blob (screen.world_compact) kept in
# the current-moment section.
world_compact_max_chars = 1200

# Continuation resolver (context engine spec §4.12). Answers "the user said
# 'ga door' — continue WHAT?" from ranked candidates that all have real
# producers: the session-state task (survives a restart via rehydration),
# the last wake's next step, the curator's `open_task:` trailer, the last
# user command, and the last error. Pure logic — no LLM call.
#
# Ranking: score = base_confidence x per-kind prior x recency decay.
# Priors (highest first): session task 1.0, last wake's next step 0.9,
# open_task 0.8, last user command 0.7, last error 0.5 — an error is a
# symptom, a task is intent. Recency decay is flat for 30 minutes, then
# halves per hour, floored at 0.1.
[continuation]
# Score the best candidate must reach before Continuum acts on it. At or
# above: the wake package renders "## Recommended next step" and the wake
# reason says `Continue: <target>`. Below: the wake reason instructs the
# orchestrator to ask ONE short question naming up to three candidates.
confidence_floor = 0.6
# Utterances that mean "pick up where we left off". Matched
# case-insensitively as a whole utterance or a word-boundary prefix
# ("ga door met de tests" counts; "continued" does not). A hotkey press
# with no words at all counts as a trigger by itself.
trigger_phrases = ["ga door", "continue", "verder", "waar was ik", "pak weer op"]
# How far back the runtime looks for the last `wake_result` event when
# collecting candidates. Deliberately much longer than
# [context_package] events_window_minutes: "ga door" after lunch still has
# to find this morning's next step.
wake_result_lookback_hours = 12

[stt]
name = "Whisper small"
variant = "whisper-small"
path = "~/.continuum/models/stt/whisper-small.bin"
size_mb = 244
runtime = "whisper-cpp"
# Alternatives: whisper-tiny, whisper-base, whisper-medium, whisper-large-v3

[tts]
# Phase 5 TTS is fully local (Piper). Every model file must exist before
# `cargo run --bin continuum` attempts to speak - otherwise whisper decisions
# and orchestrator responses will fall through to log-only mode.
#
# Run `powershell scripts/download-models.ps1` to populate ~/.continuum-dev/models/tts/
# AND to install piper.exe + espeak-ng-data under ~/.continuum-dev/bin/piper/.
#
# OUTPUT STRATEGY: Continuum speaks English by default because the Dutch Piper
# voices available as of 2026-04 (nl_NL-mls-medium) produce barely-
# intelligible speech. Input is still multilingual - whisper.cpp
# transcribes any language the user speaks and Continuum understands it;
# Continuum just always responds in English.
#
# To re-enable multilingual output later (e.g. once a better Dutch voice
# ships):
#   1. Set [voice].language_detection_enabled = true
#   2. Uncomment the [tts.voices.nl] section below (and/or add more)
#   3. Drop the "always respond in English" rule from
#      prompts/orchestrator-system.md

enabled = true

# Engine backend: "piper" (local, default) or "elevenlabs" (cloud plugin,
# requires an API key below). Phase 5 ships Piper only; ElevenLabs is a
# config-stable extension point for a later plugin release.
engine = "piper"

# espeak-ng dictionary directory (exported as PIPER_ESPEAKNG_DATA_DIRECTORY
# at startup). Installed by scripts/download-models.ps1 from the Piper
# Windows release bundle.
espeak_data_dir = "~/.continuum-dev/models/tts/espeak-ng-data"

# BCP-47 short code of the voice used when no language hint is available.
# When language_detection_enabled = false (default), this is the ONLY
# voice Continuum ever uses, regardless of the transcribed input language.
primary = "en"

# length_scale = 1.0 is Piper's default. <1.0 speeds up speech, >1.0 slows
# it down. `None` (omit) uses the value baked into the voice config.
# length_scale = 1.0

[tts.voices.en]
model_path  = "~/.continuum-dev/models/tts/en_US-norman-medium.onnx"
config_path = "~/.continuum-dev/models/tts/en_US-norman-medium.onnx.json"
# en_US-norman-medium is single-speaker - leave unset.
# speaker_id = 0

# Dutch voice disabled by default - nl_NL-mls-medium produces low-
# intelligibility speech. The download script still installs the files
# so you can opt in by uncommenting this section and setting
# [voice].language_detection_enabled = true.
# [tts.voices.nl]
# model_path  = "~/.continuum-dev/models/tts/nl_NL-mls-medium.onnx"
# config_path = "~/.continuum-dev/models/tts/nl_NL-mls-medium.onnx.json"
# speaker_id  = 0

# Optional ElevenLabs streaming cloud backend. Disabled by default. To
# activate, set engine = "elevenlabs" above and provide credentials here.
[tts.elevenlabs]
api_key          = ""
voice_id         = ""
model_id         = "eleven_turbo_v2_5"
stability        = 0.5
similarity_boost = 0.75

[voice]
enabled = true
wake_word_enabled = true
wake_keyword = "hey continuum"
wake_sensitivity = 0.5
# Optional native wake-word .ppn path. Empty uses local transcript detection
# over Whisper output, so Continuum still has a fully local wake gate without an
# access-key dependency in core.
custom_keyword_path = ""
listen_timeout_ms = 12000
endpoint_silence_ms = 700
min_utterance_chars = 3
barge_in_enabled = true
ambient_mute_enabled = true

# Route TTS to a per-language voice based on whisper's detected language.
# Disabled by default: Continuum understands any language the user speaks
# (whisper_language = "auto" above) but always responds in English via
# the [tts].primary voice. Enable only if you have a quality voice file
# for every language you want Continuum to speak.
language_detection_enabled = false

default_language = "en"

# Master playback gain [0.0, 1.0]. Applied in the cpal callback; takes
# effect on the next audio buffer.
volume = 0.8

# Play short audio cues (chime on wake, click on listen start, double-beep
# on error). Set to false for fully silent state transitions.
feedback_sounds = true

# Global hotkey for toggle-listen. Empty string disables it. Modifier
# chord: "Ctrl", "Shift", "Alt", "Win" joined with "+".
hotkey = "Ctrl+Shift+K"

# After Continuum finishes speaking, keep the voice session alive this many
# seconds for a natural follow-up without re-triggering the wake word.
# Set to 0 to require wake word on every interaction.
conversation_followup_seconds = 5

# Phase 4: MCP server configuration (filesystem allowlist extension)
# Default allowed roots: ~/.continuum-dev/ and every semantic fact matching key
# "project.*.dir". The deny list is hardcoded and cannot be disabled. Add extra
# read-only directories here to expand what Opus can inspect via fs_read_file /
# fs_list_dir. Paths support ~ expansion.
[mcp.fs]
extra_paths = []
max_write_bytes = 1048576
max_patch_replacements = 100

[mcp.terminal]
allowed_programs = ["cargo", "git", "dotnet", "rustc", "rustfmt"]
max_timeout_secs = 900
max_output_bytes = 524288
max_args = 128

[mcp.ide]
allowed_editors = ["code", "code-insiders", "codium"]
launch_timeout_secs = 15

[mcp.browser]
enabled = false
port = 9222
allowed_hosts = ["localhost", "127.0.0.1"]
max_text_bytes = 131072
timeout_secs = 10

[github]
enabled = true
connect_timeout_secs = 600
api_timeout_secs = 30
max_response_bytes = 524288
max_mutation_body_bytes = 65536
max_title_chars = 256

# Visible distinction between the user's pointer and Agent OS actions.
[agent_os]
show_action_cursor = true
action_cursor_duration_ms = 420
action_cursor_size_px = 30

# Adaptive resource policy. Probed once at boot (CPU cores, RAM, GPU/VRAM,
# laptop-vs-desktop, AC-vs-battery) and resolved into concrete knobs applied
# to the triage LLM, vision model, whisper, screen/context pollers, and
# worker pool. Override via the dashboard Settings → Resources panel or here.
# See crates/continuum-core/src/hardware.rs + ARCHITECTURE.md "Resource policy".
[resources]
# Profile preset. "auto" picks barely_notice on laptops / CPU-only boxes and
# balanced on a GPU desktop. "custom" honours every field below verbatim.
profile = "barely_notice"

# Fraction (0.0-1.0) of logical cores local models may use on AC power.
# Barely-notice default 0.30; balanced 0.55; performance 0.80.
cpu_core_fraction = 0.30
# Floor / cap for local-model thread counts (the OS + orchestrator need cores too).
cpu_min_threads = 2
cpu_max_threads = 8
# Fraction of total RAM to leave free for the OS + other apps.
ram_reserve_fraction = 0.50

# GPU: null = auto-detect (nvcuda.dll + nvidia-smi), true = force on, false = force off.
gpu_enabled = null
# Minimum VRAM (MB) to enable GPU offload. Below this, fall back to CPU.
gpu_min_vram_mb = 3000

# Throttle harder on battery power.
battery_throttle = true
battery_core_fraction = 0.20

# Vision model: null = auto (on when total RAM >= vision_min_ram_mb), true/false = force.
vision_enabled = null
# Below this much total RAM, vision is disabled and perception runs text-only.
vision_min_ram_mb = 6144

# Override the derived worker concurrency cap. null = derive from cores + RAM
# (halved on battery, capped by ram_gb/4, clamped 1-10).
workers_max_concurrent = null

# Override the derived poll intervals (seconds). null = derive from profile
# (screen: 3s AC / 5s battery; context: 1s AC / 2s battery).
screen_interval_secs = null
context_interval_secs = null
