# Continuum MCP tool permission tiers
#
# These tiers are enforced by `PermissionedMcpServer` before the tool body runs.
#
#   auto             — may run without confirmation
#   session-approved — native confirmation once per MCP process/session
#   always-confirm   — native confirmation for every call
#   blocked          — cannot run through the ordinary MCP process
#
# Override in `<data-dir>/permissions.toml` or point
# CONTINUUM_PERMISSIONS_FILE at an explicit policy file. Unknown tools fail
# closed as `always-confirm` until they are classified here.

[memory]
memory_query_episodic = "auto"
memory_list_facts     = "auto"
memory_get_fact       = "auto"
memory_set_fact       = "session-approved"

# Direct vault search/get can return user-authored bodies. They therefore need
# one independent approval per MCP session; results marked sensitivity=sensitive
# are additionally stripped by the egress gate even after approval.
memory_vault_search   = "session-approved"
memory_vault_get      = "session-approved"
memory_vault_save     = "session-approved"
memory_vault_resolve  = "session-approved"
memory_vault_delete   = "always-confirm"
memory_wipe_all       = "always-confirm"

# Desktop chat may inspect typed settings automatically. Mutations are still
# gated once per chat/MCP session and can only target fields that already exist
# in ContinuumConfig; the settings backend validates the full candidate config
# and backs up config.toml before writing it.
[settings]
settings_list = "auto"
settings_get  = "auto"
settings_set  = "session-approved"

[system]
system_current_time   = "auto"
system_active_window  = "auto"
system_live_context   = "auto"
system_clipboard_get  = "always-confirm"
system_notification   = "auto"

[context]
context_session   = "auto"
context_window    = "auto"
context_screen    = "auto"
context_audio     = "auto"
context_projects  = "auto"
context_processes = "auto"
context_timeline  = "auto"
context_search    = "auto"
context_files     = "auto"
context_git       = "auto"
context_package   = "auto"

# Read-only and path-allowlisted. The hardcoded secret/credential deny list is
# still applied after root canonicalization.
[fs]
fs_read_file = "auto"
fs_list_dir  = "auto"
fs_create_file = "session-approved"
fs_apply_patch = "session-approved"
fs_move = "session-approved"
fs_delete_to_trash = "always-confirm"

# --- Git checkpoints (allowlisted repositories only) ---
# Checkpoint writes an isolated ref but leaves the worktree/index untouched.
# Rollback changes tracked files, so it always requires a fresh confirmation.
[git]
git_diff            = "auto"
git_checkpoint_list = "auto"
git_checkpoint      = "session-approved"
git_rollback        = "always-confirm"

# --- Restricted terminal broker ---
[terminal]
terminal_verify = "session-approved"

# --- Native IDE bridge ---
ide_status    = "auto"
ide_open_file = "session-approved"
ide_open_diff = "session-approved"

# --- Opt-in browser DOM bridge ---
browser_status       = "auto"
browser_list_tabs    = "session-approved"
browser_dom_snapshot = "session-approved"
browser_navigate     = "always-confirm"
browser_click        = "always-confirm"
browser_fill         = "always-confirm"

# --- Focused-element Windows UI Automation ---
windows_ui_focused_element   = "session-approved"
windows_ui_invoke_focused    = "always-confirm"
windows_ui_set_focused_value = "always-confirm"

# --- Durable task and evidence records ---
task_plan_write = "session-approved"
task_plan_get    = "auto"
task_plan_list   = "auto"
evidence_record  = "session-approved"
evidence_list    = "auto"
terminal_run    = "always-confirm"

# --- Optional GitHub connection (official gh CLI, keyring auth only) ---
[github]
github_status      = "auto"
github_me          = "session-approved"
github_list_repos  = "session-approved"
github_get_repo    = "session-approved"
github_list_issues = "session-approved"
github_get_file    = "session-approved"
github_create_issue        = "always-confirm"
github_comment_issue       = "always-confirm"
github_create_pull_request = "always-confirm"

[web]
web_fetch = "auto"

# Repair tools are unreachable from the ordinary MCP process. A dedicated
# Health flow may pass a short-lived CONTINUUM_REPAIR_TOKEN; the server then
# performs its existing per-component and per-operation capability checks.
[repair]
repair_restart_component = "blocked"
repair_reinstall_model    = "blocked"
repair_rollback_config    = "blocked"
repair_test_component     = "blocked"
repair_escalate           = "blocked"

# Worker creation can execute code and spend money. Spawns always require a
# native confirmation; passive status operations remain automatic.
[workers]
workers_spawn_worker  = "always-confirm"
workers_worker_status = "auto"
workers_worker_wait   = "auto"
workers_worker_list   = "auto"
workers_worker_cancel = "session-approved"
