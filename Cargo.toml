[workspace]
members = [
    "crates/continuum-core",
    "crates/continuum-mcp",
    "crates/continuum-llm",
    "crates/continuum-vision",
    "crates/continuum-gateway",
    "crates/continuum-memory",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vixco/Continuum"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
llama-cpp-2 = { version = "0.1", default-features = false, features = ["sampler"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["ndarray", "load-dynamic"] }
image = "0.25"
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Phase 3: Memory layer
lancedb = "0.27"
fastembed = { version = "5.13", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
arrow-array = "57"
arrow-schema = "57"

# Note on debug builds for continuum.exe:
#
# llama-cpp-sys-2 compiles its C++ wrapper files through the `cc` crate,
# which picks /MDd based on cargo's internal DEBUG=true env var. We tried
# [env].DEBUG="false" (cargo overrides it), [profile.dev.package.*]
# debug=false (cargo's profile override doesn't propagate to the build
# script env the way we needed), and CMAKE_BUILD_TYPE=Release (only
# covers the cmake-driven part, not cc::Build). The debug Continuum binary
# ends up mixing /MDd-compiled wrapper objects with /MD-compiled Rust
# code and crashes in ucrtbased!read.cpp:381 during whisper model load.
#
# Pragmatic resolution: **release mode is the default dev loop for
# continuum.exe**. See CLAUDE.md "Build workflow" for the full story —
# TL;DR: `cargo run --release --bin continuum`, sccache makes clean
# rebuilds fast, debug mode is used for tests / examples / other
# binaries (which don't drag in llama-cpp-sys-2).
